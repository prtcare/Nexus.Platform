name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK version is read from global.json (10.0.302) rather than hardcoded here,
      # so the pipeline stays in sync with the repo's pinned SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # No nuget.config: the solution restores from nuget.org via PackageReference
      # plus ProjectReferences only (M-08-1.1 design), so no private feed auth is needed.
      - name: Restore
        run: dotnet restore Nexus.Platform.slnx

      - name: Build
        run: dotnet build Nexus.Platform.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Nexus.Platform.slnx -c Release --no-build --logger trx --results-directory ./artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn
