          - id: S-08-2.1.1.2.1
            name: Compare local refs to remote refs per repository first
        - id: T-08-2.1.1.3
          name: Remove .git-broken from all three repositories
      gate: GATE_A
  - id: F-08-3
    name: Artifact Registry
