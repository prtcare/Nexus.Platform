      interlocks and emergency stop. AI may plan, diagnose, document and propose parameters. AI must never
      bypass hard limits, emergency stops, operator approval or validated control logic.

      '
    gate_condition: 'Requires its own safety architecture, reviewed and signed off by a human, before
      any milestone under this feature is written. No milestone may be created here by Developer or by
      any agent. This is the one place in the roadmap where autonomous work-item proposal is explicitly
      forbidden.

      '
