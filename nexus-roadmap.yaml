  long_name: source, build, environments, deployment, infrastructure
- id: 09
  name: ASSURANCE
  long_name: prove that requirements have actually been satisfied
  repo: Nexus.Platform
  schema: assurance
  projects:
  - Nexus.Assurance.Contracts
  - Nexus.Assurance.Core
  - Nexus.Assurance.Infrastructure
  purpose: 'Verify and validate that what Nexus designs, builds, deploys and operates satisfies its requirements,
    quality standards, safety constraints and acceptance criteria - for software, AI, business processes,
    machines, manufacturing systems, integrations and consumer products alike.

    '
  why_it_exists: 'A green build proves code compiles and some assertions held. It does not prove a requirement
    was met. Nothing in the architecture currently closes that gap, so "done" means "someone believed
    it was done". ASSURANCE makes done an evidenced claim rather than an opinion, and it is deliberately
    broader than software testing because Nexus will build machines and business processes where inspection
    and validation matter more than unit tests.

    '
  owns:
  - QualityPlan
  - VerificationPlan
  - ValidationPlan
  - TestPlan
  - TestCase
  - InspectionPlan
  - InspectionCharacteristic
  - AcceptanceCriterion
  - VerificationMethod
  - ValidationMethod
  - VerificationRun
  - ValidationRun
  - InspectionRun
  - Evidence
  - Defect
  - Deviation
  - NonConformance
  - CorrectiveAction
  - QualityGate
  - QualificationResult
  - TraceabilityLink
  does_not_own:
  - What needs testing and which work item it belongs to - DEVELOPER
  - Executing build and automated test pipelines - DELIVERY
  - Runtime health of a deployed system - OPERATIONS
  - The formal test report document - DATA owns the document, ASSURANCE owns the result
  - The requirement itself - DEVELOPER owns Requirement; ASSURANCE owns its AcceptanceCriterion
  depends_on:
  - '01'
  - '02'
  - '03'
  traceability_model: 'Requirement -> AcceptanceCriterion -> Verification/Validation Method -> Test/Inspection/Evaluation
    -> Evidence -> Pass/Fail -> Release Qualification. Every link is a row. A requirement with no acceptance
    criterion, or a criterion with no method, is reportable as a traceability gap rather than silently
    absent.

    '
  ownership_principle: 'DEVELOPER asks what must be proven. DELIVERY executes repeatable technical verification.
    ASSURANCE determines whether the requirement has actually been satisfied. OPERATIONS proves the running
    system remains healthy.

    '
  profiles: 'Different product types activate different assurance profiles. Software activates unit, integration,
    contract and architecture verification. AI activates evaluation and citation checking. Machines activate
    inspection characteristics, measurement and validation. ERP activates process validation and user
    acceptance. A profile decides which methods are mandatory, not which are possible.

    '
  features:
  - id: F-09-1
    name: Acceptance and Traceability
    phase: P1
    purpose: 'Close the gap between a green build and a satisfied requirement. This is the minimum ASSURANCE
      the Foundation Gate needs, and it is deliberately small - criteria, methods, evidence, verdict.

      '
    responsibility: Acceptance criteria, verification methods, requirement traceability
    milestones:
    - id: M-09-1.1
      name: Acceptance criterion and verification method
      phase: P1
      outcome: 'Every work item that claims completion carries at least one acceptance criterion and a
        declared method for proving it.

        '
      depends_on:
      - M-07-1.1
      - M-02-1.5
      parallel_safe: true
      data_introduced:
      - AcceptanceCriterion
      - VerificationMethod
      - TraceabilityLink
      acceptance:
      - An AcceptanceCriterion links to exactly one DEVELOPER Requirement or WorkItem.
      - A VerificationMethod is one of Test, Inspection, Analysis, Demonstration, Evaluation.
      - A work item with no acceptance criterion is reported as a traceability gap, not silently accepted.
      - The gap report is queryable per milestone.
      work_items:
      - id: WI-09-1.1.1
        name: Acceptance criterion model
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts:
          - Nexus.Assurance.Contracts
        tasks:
        - id: T-09-1.1.1.1
          name: Define AcceptanceCriterion
          subtasks:
          - id: S-09-1.1.1.1.1
            name: Criterion text must be checkable - reject empty or unfalsifiable phrasing
          - id: S-09-1.1.1.1.2
            name: Ref computed persisted column ACC-00000001
          - id: S-09-1.1.1.1.3
            name: Polymorphic link to a DEVELOPER node by layer, type and id - no cross-schema FK
        - id: T-09-1.1.1.2
          name: Define VerificationMethod with the five method kinds
          subtasks:
          - id: S-09-1.1.1.2.1
            name: Test, Inspection, Analysis, Demonstration, Evaluation
          - id: S-09-1.1.1.2.2
            name: Method carries the profile it belongs to
      - id: WI-09-1.1.2
        name: Traceability and gap reporting
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts: []
        tasks:
        - id: T-09-1.1.2.1
          name: TraceabilityLink across Requirement, Criterion, Method, Evidence
        - id: T-09-1.1.2.2
          name: Gap query - criteria without methods, work items without criteria
          subtasks:
          - id: S-09-1.1.2.2.1
            name: Unit test proving a work item with no criterion appears in the gap report
      gate: GATE_A
      schema_conflict_group: schema:assurance
    - id: M-09-1.2
      name: Evidence and verdict
      phase: P1
      outcome: 'A pass or fail is a stored record pointing at what proved it, not a statement in a pull
        request.

        '
      depends_on:
      - M-09-1.1
      - M-08-1.3
      parallel_safe: true
      data_introduced:
      - Evidence
      - VerificationRun
      - QualificationResult
      acceptance:
      - A VerificationRun records method, criterion, actor, timestamp and verdict.
      - Evidence references a DELIVERY PipelineRun, a document, or an uploaded artefact.
      - A verdict of Pass without any linked evidence is rejected at write time.
      - A criterion's current verdict is derivable from its most recent run.
      work_items:
      - id: WI-09-1.2.1
        name: Evidence model
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts: []
        tasks:
        - id: T-09-1.2.1.1
          name: Define Evidence with source kind and opaque reference
          subtasks:
          - id: S-09-1.2.1.1.1
            name: EvidenceKind - PipelineRun, Document, Measurement, Screenshot, Attestation
          - id: S-09-1.2.1.1.2
            name: Evidence is immutable once written
        - id: T-09-1.2.1.2
          name: Define VerificationRun and QualificationResult
          subtasks:
          - id: S-09-1.2.1.2.1
            name: Reject Pass verdict with zero evidence rows
      - id: WI-09-1.2.2
        name: Ingest DELIVERY pipeline results as evidence
        scope:
          projects:
          - Nexus.Assurance.Infrastructure
          schemas:
          - assurance
          contracts: []
        tasks:
        - id: T-09-1.2.2.1
          name: Map a PipelineRun result to Evidence against the criteria it covers
          subtasks:
          - id: S-09-1.2.2.1.1
            name: A pipeline covering no declared criterion is recorded but proves nothing
      gate: GATE_A
      schema_conflict_group: schema:assurance
    - id: M-09-1.3
      name: Quality gate V1
      phase: P1
      outcome: 'An integration cannot complete while a mandatory criterion is unverified. This is what
        makes Definition of Done enforceable rather than aspirational.

        '
      depends_on:
      - M-09-1.2
      - M-07-5.1
      parallel_safe: false
      data_introduced:
      - QualityGate
      acceptance:
      - A QualityGate declares which criteria must pass before a work item may integrate.
      - DEVELOPER's IntegrationRun blocks when the gate is not satisfied, and names the failing criterion.
      - A gate can be waived only with a recorded Deviation carrying a reason and an approver.
      - The Foundation Gate acceptance test itself runs through this gate.
      work_items:
      - id: WI-09-1.3.1
        name: Gate definition and evaluation
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts:
          - Nexus.Assurance.Contracts
        tasks:
        - id: T-09-1.3.1.1
          name: QualityGate with mandatory criterion set
        - id: T-09-1.3.1.2
          name: Gate evaluation API consumed by DEVELOPER integration
          subtasks:
          - id: S-09-1.3.1.2.1
            name: Returns satisfied, or the list of unmet criteria - never a bare false
      - id: WI-09-1.3.2
        name: Waiver path
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts: []
        tasks:
        - id: T-09-1.3.2.1
          name: Deviation record with reason, approver and expiry
          subtasks:
          - id: S-09-1.3.2.1.1
            name: An expired deviation re-blocks the gate rather than lapsing silently
      gate: GATE_A
      schema_conflict_group: schema:assurance
  - id: F-09-2
    name: Defects and Non-Conformance
    phase: P2
    purpose: 'Give a failed verification somewhere to go that is not a chat message, and connect it back
      to the work that must fix it.

      '
    responsibility: Defects, deviations, non-conformance, corrective actions
    milestones:
    - id: M-09-2.1
      name: Defect lifecycle
      phase: P2
      outcome: A failed criterion produces a tracked defect linked to its evidence.
      depends_on:
      - M-09-1.2
      parallel_safe: true
      data_introduced:
