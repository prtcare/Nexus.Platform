      acceptance:
      - A Fail verdict can raise a Defect carrying the evidence that revealed it.
      - A Defect can produce a DEVELOPER WorkItem without retyping its context.
      - A Defect cannot close while its criterion still fails.
      work_items:
      - id: WI-09-2.1.1
        name: Defect model and DEVELOPER handoff
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts: []
      gate: GATE_B
      schema_conflict_group: schema:assurance
    - id: M-09-2.2
      name: Non-conformance and corrective action
      phase: P2
      outcome: 'A systemic problem is distinguishable from a one-off defect and carries a corrective action
        with an owner.

        '
      depends_on:
      - M-09-2.1
      parallel_safe: true
      data_introduced:
      - NonConformance
      - CorrectiveAction
      acceptance:
      - A NonConformance groups repeated defects sharing a root cause.
      - A CorrectiveAction has an owner, a due date and a verification of its own.
      work_items:
      - id: WI-09-2.2.1
        name: Non-conformance grouping and corrective action
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts: []
      gate: GATE_B
      schema_conflict_group: schema:assurance
  - id: F-09-3
    name: Plans and Specifications
    phase: P3
    purpose: 'Move from per-work-item criteria to declared plans, so a product or a release can state
      up front what proving it will require.

      '
    responsibility: Quality plans, verification plans, validation plans, test plans and specifications
    milestones:
    - id: M-09-3.1
      name: Test plans and test cases
      phase: P3
      outcome: Verification is planned as a set rather than assembled per work item.
      depends_on:
      - M-09-1.3
      parallel_safe: true
      data_introduced:
      - TestPlan
      - TestCase
      - TestSpecification
      acceptance:
      - A TestPlan covers a declared scope and reports its own coverage against criteria.
      - A TestCase is reusable across releases and records each execution separately.
      schema_conflict_group: schema:assurance
    - id: M-09-3.2
      name: Quality, verification and validation plans
      phase: P3
      outcome: 'A product declares its assurance obligations before it is built, not after it fails.

        '
      depends_on:
      - M-09-3.1
      - M-12-1.1
      parallel_safe: true
      data_introduced:
      - QualityPlan
      - VerificationPlan
      - ValidationPlan
      - ValidationMethod
      - ValidationRun
      acceptance:
      - A product's assurance profile selects which plans are mandatory.
      - Verification asks was it built right; validation asks was it the right thing - both are recorded
        separately.
      schema_conflict_group: schema:assurance
  - id: F-09-4
    name: Inspection and Measurement
    phase: P3
    purpose: 'Physical and manufactured things are proven by measurement against characteristics, not
      by executing tests. This is what makes ASSURANCE usable for machine and manufacturing work rather
      than software only.

      '
    responsibility: Inspection plans, inspection characteristics, inspection evidence
    milestones:
    - id: M-09-4.1
      name: Inspection plans and characteristics
      phase: P3
      outcome: A physical item can be qualified against measured characteristics with tolerances.
      depends_on:
      - M-09-3.1
      parallel_safe: true
      data_introduced:
      - InspectionPlan
      - InspectionCharacteristic
      - InspectionRun
      acceptance:
      - A characteristic carries nominal, tolerance, unit and measurement method.
      - A measurement outside tolerance produces a Fail and a Defect automatically.
      - Units are explicit on every characteristic - a unitless tolerance is rejected.
      schema_conflict_group: schema:assurance
    - id: M-09-4.2
      name: Measurement evidence and instrument traceability
      phase: P4
      outcome: A measurement records what instrument produced it and whether that instrument was in calibration.
      depends_on:
      - M-09-4.1
      parallel_safe: true
      data_introduced:
      - Instrument
      - CalibrationRecord
      acceptance:
      - A measurement taken with an out-of-calibration instrument is flagged, not silently accepted.
      schema_conflict_group: schema:assurance
  - id: F-09-5
    name: Release Qualification
    phase: P2
    purpose: 'Decide whether a release may ship, from evidence rather than from confidence.

      '
    responsibility: Regression qualification, release qualification, certification evidence
    milestones:
    - id: M-09-5.1
      name: Release qualification
      phase: P2
      outcome: 'A release carries a qualification verdict derived from its criteria, and promotion to
        Production consults it.

        '
      depends_on:
      - M-09-1.3
      - M-07-7.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A release's qualification is derived from the criteria in its scope, never entered by hand.
      - DELIVERY promotion to Production is blocked by an unqualified release.
      - The qualification names every unmet criterion.
      work_items:
      - id: WI-09-5.1.1
        name: Release qualification derivation
        scope:
          projects:
          - Nexus.Assurance.Core
          schemas:
          - assurance
          contracts:
          - Nexus.Assurance.Contracts
      gate: GATE_B
    - id: M-09-5.2
      name: Regression qualification
      phase: P3
      outcome: A previously passing criterion that starts failing is surfaced as a regression, distinctly
        from a new failure.
      depends_on:
      - M-09-5.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A criterion transitioning Pass to Fail is reported as a regression with the run that last passed.
    - id: M-09-5.3
      name: Certification evidence
      phase: P4
      outcome: Evidence can be assembled into an external-facing certification pack.
      depends_on:
      - M-09-5.2
      - M-03-4.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A certification pack exports evidence, verdicts and traceability for a declared scope.
  - id: F-09-6
    name: AI Evaluation
    phase: P3
    purpose: 'AI output cannot be verified by assertion. It needs scored evaluation against a fixed question
      set, and that evaluation is a verification method like any other.

      '
    responsibility: AI evaluation as a verification method, evaluation evidence
    milestones:
    - id: M-09-6.1
      name: Evaluation as a verification method
      phase: P3
      outcome: 'An AI evaluation run produces Evidence against an acceptance criterion, so AI quality
        claims are qualified the same way as everything else.

        '
      depends_on:
      - M-09-1.2
      - M-04-5.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - An AI evaluation run writes Evidence with its score and question set.
      - A criterion can require a minimum score, and a drop below it fails the gate.
      - Citation correctness is expressible as a criterion.
  - id: F-09-7
    name: Assurance Profiles
    phase: P3
    purpose: 'Different product types need different proof. A game, an ERP module and a boring machine
      do not share a definition of adequately verified.

      '
    responsibility: Verification methods, validation methods, profile selection
    milestones:
    - id: M-09-7.1
      name: Profile definition and selection
      phase: P3
      outcome: A product selects an assurance profile and inherits its mandatory methods.
      depends_on:
      - M-09-3.2
      parallel_safe: true
      data_introduced:
      - AssuranceProfile
      acceptance:
      - Software, AI, ERP, machine and consumer profiles exist and differ in mandatory methods.
      - Selecting a profile is a declaration, not a code change.
      - An architecture test forbids branching on product identity inside ASSURANCE.
      schema_conflict_group: schema:assurance
    - id: M-09-7.2
      name: Safety-critical profile
      phase: P4
      outcome: 'Safety requirements are verifiable, traceable and cannot be waived by the ordinary deviation
        path.

        '
      depends_on:
      - M-09-7.1
      - M-09-4.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A criterion marked safety-critical cannot be waived by a Deviation - only by a named human with
        recorded authority.
      - Safety criteria are enumerable per product and their verification state is always current.
      - No agent may create, modify or waive a safety-critical criterion.
- id: '10'
  name: OPERATIONS
  repo: Nexus.Platform
  schema: operations
  database_note: 'ops data is time-series and is the most likely first candidate to leave the shared NexusPlatform
    database for a purpose-built store.

    '
  projects:
  - Nexus.Operations.Contracts
  - Nexus.Operations.Core
  - Nexus.Operations.Infrastructure
  purpose: 'Keep running Nexus systems and products healthy, secure, observable and recoverable.

    '
  owns:
  - LogStream
  - Metric
  - Trace
  - HealthCheck
  - Incident
  - Alert
  - PerformanceRecord
  - CapacityRecord
  - CostRecord
  - FeatureFlagState
  does_not_own:
  - Anything durable about what was built or why - Layer 07
  - How it shipped - Layer 08
  depends_on:
  - '01'
  features:
  - id: F-10-1
    name: Structured Logging and Correlation
    phase: P1
    purpose: 'Correlation is disproportionately expensive to retrofit across layers. It is the one Operations
      capability that must exist before the layers multiply.

      '
    responsibility: Logs, tracing foundation
    milestones:
    - id: M-10-1.1
      name: Correlation across hosts
      phase: P1
      outcome: 'One request is traceable end to end across Experience, Developer and Intelligence by a
        single identifier.

        '
      depends_on:
      - M-01-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A correlation id is generated at the edge or accepted from the caller.
      - It propagates through the Experience API, the Intelligence turn and the model invocation.
      - One request is retrievable end to end by that id alone.
      - No log line contains a secret, a token or a full prompt body.
      work_items:
      - id: WI-10-1.1.1
        name: Logging foundation
        scope:
          projects:
          - Nexus.Operations.Infrastructure
          schemas: []
          contracts:
          - Nexus.Operations.Contracts
        tasks:
        - id: T-10-1.1.1.1
          name: Structured logging with a correlation enricher
          subtasks:
          - id: S-10-1.1.1.1.1
            name: Correlation middleware in every host
          - id: S-10-1.1.1.1.2
            name: Outbound HTTP propagates the header
        - id: T-10-1.1.1.2
          name: Redaction policy for sensitive fields
          subtasks:
          - id: S-10-1.1.1.2.1
            name: Unit test asserting a known secret pattern is redacted
      gate: GATE_A
  - id: F-10-2
    name: Metrics, Tracing and Health
    phase: P2
    purpose: 'Once something is deployed, knowing whether it works must not depend on someone looking.

      '
    responsibility: Metrics, tracing, health, performance, diagnostics
    milestones:
    - id: M-10-2.1
      name: Health checks
      phase: P2
      outcome: Every host reports its own readiness and the health of its dependencies.
      depends_on:
      - M-08-5.1
      parallel_safe: true
      data_introduced:
      - HealthCheck
      acceptance:
      - A database outage surfaces as unhealthy within one check interval.
      work_items:
      - id: WI-10-2.1.1
        name: Health endpoints and dependency probes
        scope:
          projects:
          - Nexus.Operations.Infrastructure
          schemas:
          - operations
          contracts: []
      gate: GATE_B
      schema_conflict_group: schema:operations
    - id: M-10-2.2
      name: Metrics and distributed tracing
      phase: P2
      outcome: Latency, throughput and error rate are visible per layer and per endpoint.
      depends_on:
      - M-10-1.1
      - M-10-2.1
      parallel_safe: true
      data_introduced:
      - Metric
      - Trace
      acceptance:
      - A slow turn is attributable to a specific pipeline step.
      work_items:
      - id: WI-10-2.2.1
        name: OpenTelemetry instrumentation
        scope:
          projects:
          - Nexus.Operations.Infrastructure
          schemas:
          - operations
          contracts: []
      gate: GATE_B
      schema_conflict_group: schema:operations
    - id: M-10-2.3
      name: Deployment health
      phase: P2
      outcome: A deployment's effect on health is visible immediately after it lands.
      depends_on:
      - M-10-2.2
      - M-08-5.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A deployment that degrades error rate is flagged against that deployment record.
      work_items:
      - id: WI-10-2.3.1
        name: Deployment correlation with health signals
        scope:
          projects:
          - Nexus.Operations.Core
          schemas:
          - operations
          contracts: []
      gate: GATE_B
  - id: F-10-3
    name: Incidents and Alerting
    phase: P3
    purpose: 'Turn a signal into an owned piece of work rather than a notification someone may have seen.

      '
    responsibility: Incidents, alerts, operational results
    milestones:
    - id: M-10-3.1
      name: Alerting
      phase: P3
      outcome: Threshold and anomaly conditions notify a responsible person.
      depends_on:
      - M-10-2.2
      - M-01-8.2
      parallel_safe: true
      data_introduced:
      - Alert
      acceptance:
      - An alert names the affected product, environment and probable layer.
      schema_conflict_group: schema:operations
    - id: M-10-3.2
      name: Incident lifecycle
      phase: P3
      outcome: An incident has an owner, a timeline and a recorded resolution.
      depends_on:
      - M-10-3.1
      parallel_safe: true
      data_introduced:
      - Incident
      acceptance:
      - An incident can produce a Developer work item without retyping its context.
      schema_conflict_group: schema:operations
  - id: F-10-4
    name: Cost and Capacity
    phase: P3
    purpose: 'AI and infrastructure spend must be observable before it is surprising.

      '
    responsibility: Cost monitoring, capacity
    milestones:
    - id: M-10-4.1
      name: Cost monitoring
      phase: P3
      outcome: Spend is attributable to product, environment, layer and model.
      depends_on:
      - M-04-4.1
      - M-10-2.2
      parallel_safe: true
      data_introduced:
      - CostRecord
      acceptance:
      - A cost anomaly raises an alert before the billing period closes.
      schema_conflict_group: schema:operations
    - id: M-10-4.2
      name: Capacity and performance baselines
      phase: P3
      outcome: Growth against capacity is trended rather than discovered.
      depends_on:
      - M-10-4.1
      parallel_safe: true
      data_introduced:
      - CapacityRecord
      - PerformanceRecord
      acceptance:
      - A projected capacity breach is reported with lead time.
      schema_conflict_group: schema:operations
  - id: F-10-5
    name: Feature Flags
    phase: P3
    purpose: 'Decouple deploying code from releasing behaviour, so risky changes ship dark.

      '
    responsibility: Feature flags
    milestones:
    - id: M-10-5.1
      name: Runtime feature flags
      phase: P3
      outcome: Behaviour can be enabled per environment, tenant or member without redeploying.
      depends_on:
      - M-06-3.2
      - M-08-5.1
      parallel_safe: true
      data_introduced:
      - FeatureFlagState
      acceptance:
      - A flag change takes effect without a restart and is audited.
      schema_conflict_group: schema:operations
  - id: F-10-6
    name: Security Monitoring
    phase: P4
    purpose: 'Detect misuse and compromise, which becomes meaningful only once there are real users and
      real data.

      '
    responsibility: Security monitoring
    milestones:
    - id: M-10-6.1
      name: Security signal detection
      phase: P4
      outcome: Authentication anomalies and privilege escalation attempts raise alerts.
      depends_on:
      - M-10-3.1
      - M-01-4.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Repeated cross-tenant access attempts raise an alert naming the actor.
  - id: F-10-7
    name: Recovery Operations
    phase: P4
    purpose: 'Make recovery a practised capability rather than a document.

      '
    responsibility: Recovery, disaster recovery, backup monitoring
    milestones:
    - id: M-10-7.1
      name: Recovery drills
      phase: P4
      outcome: Recovery objectives are proven by rehearsal on a schedule.
      depends_on:
      - M-08-7.2
      - M-10-3.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A drill result records actual recovery time against the stated objective.
  long_name: run and observe deployed systems
- id: '11'
  name: EXPERIENCE
  repo: Nexus.Experience
  schema: experience
  projects:
  - Nexus.Experience.Contracts
  - Nexus.Experience.Conversation
  - Nexus.Experience.Core
  - Nexus.Experience.Infrastructure
  - Nexus.Experience.Api
  - Nexus.Experience.Client
  purpose: 'Provide reusable human and system interaction capability - above all the conversation engine
    - so every layer and product gets chat without rebuilding it, and without conversation becoming the
    architecture.

    '
  owns:
  - Conversation
  - Message
  - Participant
  - Attachment
  - ConversationSession
  - MemoryReference
  - KnowledgeReference
  - ToolUsage
  - ResultReference
  - ScopeKindBinding
  - UIPreference
  - CommandDefinition
  - NotificationDelivery
  does_not_own:
  - Contextual structure - Workspace and Project are Layer 06; Milestone and WorkItem are Layer 07
  - Product domain data
  - Documents
  - Model access
  depends_on:
  - '01'
  - '02'
  - '04'
  - '06'
  principle: 'Conversation is universal. Structure is contextual. The universal core stays lightweight
    and never learns what a Milestone is. A consumer supplies an opaque ScopeRef and implements IScopeResolver;
    the engine asks for context and receives a ContextBundle it does not interpret.

    '
  supersedes: 'This layer absorbs what was the Chat product. Chat is no longer a product. Its conversation
    implementation becomes this layer; its Workspace and Project move to Layer 06; its WorkItem, Adr,
    Branch, Snapshot, Artifact and Session move to Layers 07, 08 and 02.

    '
  features:
  - id: F-11-1
    name: Conversation Core
    phase: P2
    purpose: 'Extract the universal conversation model from the Chat product so Developer, machine work
      and every future product use one engine rather than three.

      '
    responsibility: Conversation engine
    milestones:
    - id: M-11-1.1
      name: Universal conversation aggregates
      phase: P2
      outcome: 'Conversation, Message, Participant and Attachment exist as a layer with no consumer-specific
        structure in them.

        '
      depends_on:
      - M-02-1.5
      - M-01-2.1
      parallel_safe: false
      data_introduced:
      - Conversation
      - Message
      - Participant
      - Attachment
      - ConversationSession
      acceptance:
      - The conversation core contains no reference to Workspace, Project, Milestone, WorkItem, Adr, Build,
        Release, Repository or Worker.
      - ConversationType and ConversationVisibility are gone from the core, or expressed as consumer-registered
        metadata.
      - A conversation carries an opaque ScopeRef and nothing more about its context.
      - Existing conversations and messages migrate without loss.
      work_items:
      - id: WI-11-1.1.1
        name: Extract the conversation core
        scope:
          projects:
          - Nexus.Experience.Conversation
          schemas:
          - experience
          contracts:
          - Nexus.Experience.Contracts
        tasks:
        - id: T-11-1.1.1.1
          name: Move Conversation and ConversationMessage out of the Chat domain
          subtasks:
          - id: S-11-1.1.1.1.1
            name: Rename ConversationMessage to Message in the layer namespace
          - id: S-11-1.1.1.1.2
            name: Refs CNV and MSG in the established format
        - id: T-11-1.1.1.2
          name: Add Participant and Attachment
          subtasks:
          - id: S-11-1.1.1.2.1
            name: Participant references a Layer 01 CORE User or an Intelligence Agent
        - id: T-11-1.1.1.3
          name: Migrate schema from conversation to experience
          subtasks:
          - id: S-11-1.1.1.3.1
            name: Preserve existing rows; this is a rename, not a rebuild
      - id: WI-11-1.1.2
        name: Reference types
        scope:
          projects:
          - Nexus.Experience.Conversation
          schemas:
          - experience
          contracts: []
        tasks:
        - id: T-11-1.1.2.1
          name: MemoryReference, KnowledgeReference, ToolUsage, ResultReference
          subtasks:
          - id: S-11-1.1.2.1.1
            name: All are opaque ids plus a kind - no cross-layer foreign keys
      gate: GATE_B
      schema_conflict_group: schema:experience
    - id: M-11-1.2
      name: Purge product concepts from the conversation layer
      phase: P2
      outcome: 'The rule that conversation must not become the architecture is enforced by a test rather
        than by discipline.

        '
      depends_on:
      - M-11-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - An architecture test fails if the conversation core references any Layer 06, 07 or 12 assembly.
      - The forbidden-type list is explicit and reviewed.
      work_items:
      - id: WI-11-1.2.1
        name: Boundary enforcement
        scope:
          projects:
          - Nexus.Experience.Conversation
          schemas: []
          contracts: []
        tasks:
        - id: T-11-1.2.1.1
          name: NetArchTest rule over the conversation assembly
      gate: GATE_B
  - id: F-11-2
    name: Scope Resolution
    phase: P2
    purpose: 'The mechanism that lets one conversation engine serve consumers with completely different
      structure - Developer with milestones and tasks, a plain conversation with just a project, machine
      work with its own hierarchy.

      '
    responsibility: Contextual capability, scope binding
    milestones:
    - id: M-11-2.1
      name: IScopeResolver contract and dispatch
      phase: P2
      outcome: 'Any layer can bind its own structure to a conversation without the engine or Intelligence
        learning that structure.

        '
      depends_on:
      - M-11-1.1
      - M-06-1.2
      parallel_safe: true
      data_introduced:
      - ScopeKindBinding
      acceptance:
      - A consumer registers a scope kind and a resolver, and conversations against that kind receive
        its context.
      - Two consumers with different hierarchies are served by one engine simultaneously.
      - The engine calls the resolver and passes the resulting ContextBundle through untouched.
      - An unregistered scope kind produces a clear error, not an empty bundle.
      work_items:
      - id: WI-11-2.1.1
        name: Resolver contract and registry
        scope:
          projects:
          - Nexus.Experience.Contracts
          - Nexus.Experience.Core
          schemas:
          - experience
          contracts:
          - Nexus.Experience.Contracts
        tasks:
        - id: T-11-2.1.1.1
          name: Define IScopeResolver returning ContextBundle for a ScopeRef
          subtasks:
          - id: S-11-2.1.1.1.1
            name: The contract mentions no consumer type
          - id: S-11-2.1.1.1.2
            name: Resolution is tenant-scoped and permission-checked
        - id: T-11-2.1.1.2
          name: Registry binding scope kind to resolver
      - id: WI-11-2.1.2
        name: Reference resolver for plain conversation
        scope:
          projects:
          - Nexus.Experience.Core
          schemas: []
          contracts: []
        tasks:
        - id: T-11-2.1.2.1
          name: Workspace and Project resolver over Layer 06 primitives
          subtasks:
          - id: S-11-2.1.2.1.1
            name: This is the simplest possible resolver and doubles as the worked example
      gate: GATE_B
      schema_conflict_group: schema:experience
  - id: F-11-3
    name: Chat Surface
    phase: P2
    purpose: 'One reusable chat interface consumed by every product, replacing the Chat-product-specific
      client.

      '
    responsibility: Chat, shared experience components
    milestones:
    - id: M-11-3.1
      name: Reusable chat components
      phase: P2
      outcome: 'The thread, composer, conversation list and citations panel become a consumable component
        set rather than one product''s pages.

        '
      depends_on:
      - M-11-2.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - The component set renders against any registered scope kind.
      - Citations, usage and decision trace render as built in F3.
      - No component imports a Developer or product type.
      work_items:
      - id: WI-11-3.1.1
        name: Extract chat components
        scope:
          projects:
          - Nexus.Experience.Client
          schemas: []
          contracts: []
        tasks:
        - id: T-11-3.1.1.1
          name: Generalise ChatPanel, MessageThread, ConversationList
          subtasks:
          - id: S-11-3.1.1.1.1
            name: Scope becomes a prop, not a hardcoded project lookup
        - id: T-11-3.1.1.2
          name: Keep CitationsPanel and telemetry context intact
      - id: WI-11-3.1.2
        name: Conversation API
        scope:
          projects:
          - Nexus.Experience.Api
          schemas: []
          contracts: []
        tasks:
        - id: T-11-3.1.2.1
          name: Expose conversation endpoints at /experience/v1
        - id: T-11-3.1.2.2
          name: Retire the Chat product API surface
      gate: GATE_B
  - id: F-11-4
    name: Commands and Search UX
    phase: P3
    purpose: 'Give people a fast structural route to anything, so conversation is a choice rather than
      the only path.

      '
    responsibility: Commands, search UX
    milestones:
    - id: M-11-4.1
      name: Command palette
      phase: P3
      outcome: Any registered action is reachable by keyboard from anywhere.
      depends_on:
      - M-11-3.1
      parallel_safe: true
      data_introduced:
      - CommandDefinition
      acceptance:
      - A layer registers a command and it appears without a client change.
      schema_conflict_group: schema:experience
    - id: M-11-4.2
      name: Unified search
      phase: P3
      outcome: One search returns documents, knowledge, conversations and work-graph nodes.
      depends_on:
      - M-02-4.1
      - M-11-4.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Results are permission-filtered before ranking, not after.
  - id: F-11-5
    name: Forms, Approvals and Notification UX
    phase: P3
    purpose: 'Standardise the interaction patterns every product otherwise reinvents.

      '
    responsibility: Forms, human approvals, notification UX
    milestones:
    - id: M-11-5.1
      name: Approval surface
      phase: P3
      outcome: A pending approval from any layer is actionable in one consistent place.
      depends_on:
      - M-05-5.1
      - M-11-3.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A Developer integration approval and a workflow approval render identically.
    - id: M-11-5.2
      name: Notification centre
      phase: P3
      outcome: Notifications from any layer are visible, dismissable and routable.
      depends_on:
      - M-01-8.2
      parallel_safe: true
      data_introduced:
      - NotificationDelivery
      acceptance:
      - A person sets per-channel preferences that every producing layer honours.
      schema_conflict_group: schema:experience
  - id: F-11-6
    name: Component System
    phase: P3
    purpose: 'A shared visual and interaction language so a second product does not mean a second design
      system.

      '
    responsibility: Shared experience components, adaptive UI
    milestones:
    - id: M-11-6.1
      name: Design tokens and primitives
      phase: P3
      outcome: Products share tokens, layout primitives and form controls.
      depends_on:
      - M-11-3.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A theme change propagates to every product without per-product edits.
      - Every interactive primitive is keyboard reachable and has a visible focus state.
    - id: M-11-6.2
      name: Contextual capability UI
      phase: P3
      outcome: The interface surfaces the capabilities the current scope actually offers.
      depends_on:
      - M-11-6.1
      - M-06-3.2
      parallel_safe: true
      data_introduced:
      - UIPreference
      acceptance:
      - A capability the member is not entitled to is absent, not disabled.
      schema_conflict_group: schema:experience
  - id: F-11-7
    name: Voice and Realtime
    phase: P4
    purpose: 'Extend interaction beyond text where the domain calls for it - notably hands-busy machine
      and field work.

      '
    responsibility: Voice, realtime interaction
    milestones:
    - id: M-11-7.1
      name: Streaming and realtime presence
      phase: P4
      outcome: Responses stream token by token and participants see each other.
      depends_on:
      - M-11-3.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A long response renders progressively rather than after completion.
    - id: M-11-7.2
      name: Voice input and output
      phase: P4
      outcome: A conversation can be conducted without a keyboard.
      depends_on:
      - M-11-7.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Voice input produces the same ContextBundle path as typed input.
  long_name: reusable human and system interaction
  chat_note: EXPERIENCE owns the reusable conversation capability. An optional consumer-facing Nexus Chat
    application may later exist under PRODUCTS and would consume this engine. The universal conversation
    engine is never a Chat product.
- id: '12'
  name: PRODUCTS
  repo: Nexus.Products.<Name> - one repository per product
  schema: per-product database, not a shared schema
  database_note: 'Layers 01-10 share the NexusPlatform database with a schema each. Each product gets
    its own database, because product data has its own lifecycle, retention and residency, and because
    a product should be removable.

    '
  projects:
  - Nexus.Products.<Name>.Domain
  - Nexus.Products.<Name>.Application
  - Nexus.Products.<Name>.Infrastructure
  - Nexus.Products.<Name>.Api
  - Nexus.Products.<Name>.Client
  purpose: 'Solve actual user, business and domain problems by composing Nexus capability.

    '
  owns:
  - Everything domain-specific to a product
  does_not_own:
  - Anything a lower layer owns
  - Another product's types - products never reference each other
  depends_on:
  - '01'
  - '02'
  - '03'
  - '04'
  - '05'
  - '06'
  - '07'
  - 08
  - '10'
  - '11'
  architecture: 'Product = Product Core (domain-specific identity, context, settings, state) + Domain
    Modules (the actual business capability) + Capability Integrations (how this product consumes layers
    01-10). Common capability - authentication, membership, subscriptions, entitlements, onboarding -
    comes from Layers 01 and 06 and is never duplicated per product.

    '
  composition_rule: 'Products declare capability packs. There is no if-product-equals branching anywhere
    in the platform, and an architecture test enforces it.

    '
  scheduling_note: 'Two categories with different scheduling. Consumer products are planned and scheduled.
    Internal business systems are pulled in when the business needs them; their phase means eligible from,
    not scheduled for.

    '
  features:
  - id: F-12-1
    name: Product Framework
    phase: P3
    purpose: 'Make standing up a product a repeatable composition rather than a construction project,
      so the second product costs a fraction of the first.

      '
    responsibility: Generic product architecture, product lifecycle, integration model
    milestones:
    - id: M-12-1.1
      name: Product template and integration checklist
      phase: P3
      outcome: 'A new product follows one documented path from registration to running, with no step invented
        per product.

        '
      depends_on:
      - M-06-2.1
      - M-07-7.2
      - M-11-3.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - The path is - register in Governance, define Product Core, declare capability packs, model domain
        modules, integrate Layer 06 membership, register a Layer 11 EXPERIENCE scope resolver, define
        the ContextBundle mapper, add a Delivery pipeline, add Operations instrumentation.
      - A reference product is stood up following it, end to end, and the elapsed time is recorded as
        a baseline.
      - No step requires modifying a layer below 11.
    - id: M-12-1.2
      name: Capability pack composition
      phase: P3
      outcome: A product's capabilities are declared data rather than conditional code.
      depends_on:
      - M-12-1.1
      - M-07-8.3
      parallel_safe: true
      data_introduced:
      - CapabilityPack
      acceptance:
      - An architecture test fails any branch on product identity across the whole solution.
      - Adding a capability to a product is a declaration change, not a code change.
    - id: M-12-1.3
      name: Product state model
      phase: P3
      outcome: 'Product state is eight independent dimensions rather than one ambiguous status field.

        '
      depends_on:
      - M-12-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - ProductLifecycleState, DevelopmentStage, CurrentRelease, CurrentProductionRelease, DevelopmentHealth,
        DeploymentState, OperationalHealth and ComplianceState are separately addressable.
      - Each is marked derived or manual, and every derived one is computed, never entered.
