meta:
  version: '2.2'
  generated: '2026-08-21'
  supersedes: nexus-roadmap.yaml v2.1
  companion: NEXUS_MASTER_ARCHITECTURE.md v2.2
  governing_principles:
  - Layers define responsibility, not chronological order.
  - Phases cut across layers. A layer's milestones are scattered across phases by dependency and value,
    never grouped into one block.
  - Build only the minimum capability required before starting real business systems.
  - Do not complete CORE, DATA, AI or DEVELOPER in full before building ERP.
  - Short architecture names are for humans. Stable technical names are not changed without technical
    value.
  - Business development begins immediately after GATE A Development Ready.
  - Nexus development continues simultaneously and never blocks business development.
  - Independent work runs simultaneously. Do not artificially serialise.
  - Structured state belongs to its owning domain. Documentation belongs to DATA.
  - Conversation is universal; structure is contextual.
  - A feature is not complete because code was written. It is complete when its requirements are verified
    and acceptance evidence exists.
  - Architect for the future; build for today's need.
  changes_from_v2_1:
  - 'Two gates: GATE A Development Ready (earlier, lighter) and GATE B Foundation Ready'
  - Internal business systems eligible immediately after GATE A, not after the full foundation
  - GATE B work runs in parallel with business development and must never pause it
  - Removed Nexus.Intelligence.* -> Nexus.AI.* rename - no technical value, pure churn
  - EXPERIENCE, durable AI memory and usage metering moved out of GATE A into P2
  - 12 layers, ASSURANCE, Workspace/Project ownership and Chat/EXPERIENCE direction all unchanged
  changes_from_v2_0:
  - 12 layers with short names; ASSURANCE inserted at 09
  - Former 09 Operations -> 10; former 10 Experience -> 11; former 11 Products -> 12
  - Foundation Gate reworked around minimum capability, not layer completion
  - Test ownership split explicitly across DEVELOPER, DELIVERY, ASSURANCE, OPERATIONS
  depth_rule: 'Decomposition depth is a function of phase, not importance. P0/P1 decompose to subtask;
    P2 to work item; P3 to milestone; P4/P5 to feature. DEVELOPER deepens future items as they approach
    execution. Do not fabricate tasks for systems whose requirements are unknown.

    '
  layer_names:
    '01':
      short: CORE
      long: universal technical foundation
    '02':
      short: DATA
      long: information, documents, knowledge and retrieval
    '03':
      short: GOVERNANCE
      long: registries of products, technology, brand, compliance
    '04':
      short: AI
      long: reasoning, agents, context, models
    '05':
      short: AUTOMATION
      long: workflow and process execution
    '06':
      short: PRODUCT CORE
      long: reusable product capability and scope primitives
    '07':
      short: DEVELOPER
      long: define, plan and build software
    08:
      short: DELIVERY
      long: source, build, environments, deployment, infrastructure
    09:
      short: ASSURANCE
      long: prove that requirements have been satisfied
    '10':
      short: OPERATIONS
      long: run and observe deployed systems
    '11':
      short: EXPERIENCE
      long: reusable human and system interaction
    '12':
      short: PRODUCTS
      long: real business and customer problems
  responsibility_summary:
    CORE: provides the universal foundation
    DATA: stores, governs and retrieves information and documentation
    GOVERNANCE: records what products, technologies, brands, domains, licences and obligations exist
    AI: reasons
    AUTOMATION: executes processes
    PRODUCT CORE: provides reusable product-level capabilities
    DEVELOPER: defines, plans and builds software
    DELIVERY: manages source, builds, environments, deployment, backup and infrastructure
    ASSURANCE: proves that requirements have been satisfied
    OPERATIONS: runs and observes deployed systems
    EXPERIENCE: manages reusable human/system interaction
    PRODUCTS: solve real business and customer problems
  test_ownership:
    DEVELOPER: what needs testing, which requirement it belongs to, development test state, test request,
      development result
    DELIVERY: build, unit test execution, integration test execution, pipeline run, artifacts, environment
      deployment
    ASSURANCE: test plan, acceptance criteria, verification, validation, inspection, pass/fail qualification,
      evidence, quality gates, release acceptance
    OPERATIONS: health, availability, performance, runtime alerts, production incidents, SLO/SLA evidence
    principle: 'DEVELOPER asks what must be proven. DELIVERY executes repeatable technical verification.
      ASSURANCE determines whether the requirement has actually been satisfied. OPERATIONS proves the
      running system remains healthy.

      '
phases:
- id: P0
  name: Groundwork
  intent: 'Make the current system safe, verifiable and single-stack. Nothing new is designed. Everything
    here finishes what is already started or closes a hole that makes parallel work impossible.

    '
  entry: none
  exit:
  - CI green on every repository, branch protection enforced
  - Azure SQL is the only persistence backend; Dataverse removed
  - AI state survives a restart
  - Citations proven against a live model
  estimate: 4-5 weeks
  streams:
  - single
- id: P1
  name: Development Ready
  intent: 'Reach GATE A - the MINIMUM capability required to safely begin real business development. Not
    complete CORE, DATA, AI and DEVELOPER; only enough of each. Real identity, minimum assurance, and
    DEVELOPER V1a proving three simultaneous isolated work items. EXPERIENCE, durable AI memory and usage
    metering are deliberately NOT here.

    '
  entry: P0 complete
  exit:
  - GATE A acceptance test passes - three workers, isolated, evidenced, reviewed, integrated
  - Every action attributable to a real user in an enforced tenant
  - A work item cannot integrate while a mandatory acceptance criterion is unverified
  - Internal business systems are now eligible to start
  estimate: 8-10 weeks
  streams:
  - single
- id: P2
  name: Business Development and Nexus Continuation
  intent: 'GATE A opens and development splits into two permanent streams. Stream A begins real business
    systems immediately - ERP core first, because the other internal systems reuse its foundation. Stream
    B completes the broader foundation toward GATE B. Neither waits for the other, and Stream B never
    blocks Stream A.

    '
  entry: GATE A closed
  exit:
  - One business system is delivering real value to the business
  - GATE B Foundation Ready criteria met - see gates below
  - DEVELOPER dispatches, monitors and integrates work without manual orchestration
  - A commit reaches a running environment without a human running a build
  - Deployed systems are observable
  estimate: 12-16 weeks
  streams:
  - 'A: Business systems - ERP core, then pulled by need'
  - 'B: Nexus continuation toward GATE B - EXPERIENCE, durable AI, DEVELOPER V1b, DELIVERY, OPERATIONS,
    ASSURANCE'
- id: P3
  name: Breadth
  intent: 'Stream A widens across business systems as they are pulled. Stream B builds the capability
    that makes each additional product cheaper - governance, automation, product core, retrieval, the
    experience system, assurance plans.

    '
  entry: P2 exit criteria met for the first business system
  exit:
  - A new product can be stood up by composition rather than construction
  - Governance answers what exists, who owns it and what obligations it carries
  - Retrieval quality is measurable
  - Assurance covers inspection and validation, not only test
  estimate: 16-24 weeks
  streams:
  - 'A: Business systems, pulled by need'
  - 'B: Platform maturity'
- id: P4
  name: Consumer Products and Scale
  intent: 'Consumer public products on the matured platform, and the capability they need that internal
    systems did not - mobile, offline sync, payments, marketplace, voice.

    '
  entry: P3 capability exists for the specific product being started
  exit: Per product - each has its own gate
  estimate: continuous
  streams:
  - 'A: Consumer products'
  - 'B: Nexus continuation'
  - 'C: Business systems, continuing'
- id: P5
  name: Nexus Builds Nexus
  intent: 'Evaluation-driven self-improvement, advanced autonomy, and the safety-critical domains that
    require their own architecture and their own human sign-off.

    '
  entry: P4 underway with at least one product in general availability
  exit: open-ended
  estimate: open-ended
  streams:
  - 'A: Products'
  - 'B: Self-improvement'
  - 'C: Machine systems, gated'
gates:
- id: GATE_A
  name: Development Ready
  intent: 'The earliest safe point at which internal business systems such as Business OS / ERP can begin.
    Contains only the minimum capability needed to develop safely - nothing more. This gate exists because
    the broader foundation is too heavy to stand in front of real business value.

    '
  closes_at: M-07-5.3
  closes_when: 'Three independent work items are planned, isolated, built, tested, evidenced, reviewed
    and integrated simultaneously, against a system with real identity, a single persistence backend,
    automated build verification, an AI gateway callable from DEVELOPER, and a quality gate that blocks
    integration while a mandatory acceptance criterion is unverified.

    '
  minimum:
    CORE:
    - Identity foundation
    - Authentication
    - Organisation / tenant
    - Basic authorization
    - Secrets
    - Minimum audit for development accountability
    DATA:
    - Azure SQL foundation
    - EF Core migration convention
    - Schema ownership
    - Database standards
    - Minimum persistence needed by DEVELOPER
    AI:
    - Working model gateway
    - AI callable from DEVELOPER
    - Minimum context handling for development assistance
    DEVELOPER:
    - Product/project development record
    - Requirement
    - Release only where a business system needs one - full release maturity is GATE B
    - Milestone
    - Feature
    - Work Item
    - Task
    - Subtask where needed
    - Dependencies
    - Worker
    - Worker Assignment
    - Branch/worktree coordination
    - Simultaneous development
    - Build/test result capture
    - Review
    - Progress/state
    - Controlled integration
    DELIVERY:
    - Package feed reachable from CI - blocks every pipeline
    - Git repository integration
    - Branch/worktree rules
    - CI build
    - Automated test execution
    - Branch protection
    - Build/test result availability to DEVELOPER
    - Source backup/recovery minimum
    ASSURANCE:
    - Acceptance Criterion
    - Verification Method
    - Evidence
    - Pass / Fail
    - Basic quality gate
    GOVERNANCE:
    - Product identity only - DEVELOPER's work graph needs a real ProductId
    PRODUCT CORE:
    - Workspace, Project, Subproject only - DEVELOPER's scope trunk
  explicitly_not_required: 'Durable AI memory, advanced model routing, RAG, evaluations, multiple providers,
    EXPERIENCE conversation surfaces, usage metering, the full ASSURANCE layer, AUTOMATION, OPERATIONS
    beyond structured logging, and every GOVERNANCE registry beyond product identity. None of these may
    block business development unless a concrete dependency requires them.

    '
  unblocks: Internal business systems become eligible immediately. ERP / Business OS first.
- id: GATE_B
  name: Foundation Ready
  intent: 'Confirms the broader reusable Nexus foundation is established - the capability that makes each
    additional product cheaper rather than the capability needed to build the first one.

    '
  closes_at: end of P2
  closes_when:
  - M-04-1.2
  - M-11-2.1
  - M-11-3.1
  - M-07-3.2
  - M-08-5.1
  - M-10-2.2
  - M-09-5.1
  critical_rule: 'GATE B work runs in parallel with business development and must NEVER pause or block
    it. A business system waiting on GATE B is a scheduling error, not a dependency.

    '
business_systems:
  eligible_from: GATE_A
  rule: 'Eligible means pulled by business need, not scheduled. All becoming eligible does not mean all
    start. Business OS / ERP is generally the first broad internal system unless existing requirements
    justify a different immediate priority.

    '
  systems:
  - F-12-8 Business OS/ERP
  - F-12-9 CRM/Field Data
  - F-12-10 Engine Works
  - F-12-11 Retreads
  - F-12-12 Transport
  - F-12-13 Knowledge Systems
  - F-12-14 Internal Tools
  - F-12-15 Machine Development
  recommended_first: F-12-8
ai_naming:
  layer_short_name: AI
  technical_assemblies: Nexus.Intelligence.* - unchanged
  rule: 'Short architecture names are for human comprehension. Stable technical names are not changed
    without technical value. No rename work exists in this roadmap.

    '
layers:
- id: '01'
  name: CORE
  repo: Nexus.Platform
  schema: core
  projects:
  - Nexus.Platform.Contracts
  - Nexus.Platform.Core
  - Nexus.Platform.Identity
  - Nexus.Platform.Authorization
  - Nexus.Platform.Persistence
  - Nexus.Platform.Providers.OpenAI
  - Nexus.Platform.Providers.Anthropic
  - Nexus.Platform.Tools
  purpose: 'Provide the universal technical foundation used by Nexus itself and by every product, so no
    product ever re-implements identity, tenancy, authorization, audit, secrets or model access.

    '
  owns:
  - User
  - Credential
  - Session
  - Organisation
  - Tenant
  - Role
  - Permission
  - Policy
  - AuditEntry
  - SecretRef
  - UsageRecord
  - ModelDescriptor
  - ToolDescriptor
  - NotificationChannel
  does_not_own:
  - Any product concept
  - Any development concept
  - Documents
  - Workflow definitions
  - Domain rules
  - Conversation content
  depends_on: []
  features:
  - id: F-01-1
    name: Identity and Authentication
    phase: P1
    purpose: 'Give the system a real subject. Every ownership, assignment, review, approval and audit
      record is meaningless without one, and the placeholder currently in place returns a hardcoded tenant.

      '
    responsibility: Identity, authentication, sessions
    milestones:
    - id: M-01-1.1
      name: Identity domain and schema
      phase: P1
      outcome: 'User, Credential and Session exist as real aggregates in the identity schema, replacing
        the 240-byte IdentityProvider stub.

        '
      depends_on:
      - M-02-1.4
      parallel_safe: false
      data_introduced:
      - User
      - Credential
      - Session
      acceptance:
      - User, Credential and Session tables exist in the identity schema with Id/Seq/Ref.
      - Nexus.Platform.Identity/IdentityProvider.cs is deleted, not extended.
      - Architecture tests confirm Platform references no product assembly.
      work_items:
      - id: WI-01-1.1.1
        name: User and Credential aggregates
        scope:
          projects:
          - Nexus.Platform.Identity
          schemas:
          - core
          contracts:
          - Nexus.Platform.Contracts
        tasks:
        - id: T-01-1.1.1.1
          name: Define User aggregate
          subtasks:
          - id: S-01-1.1.1.1.1
            name: UserId strongly-typed identifier
          - id: S-01-1.1.1.1.2
            name: Ref computed persisted column USR-00000001
          - id: S-01-1.1.1.1.3
            name: UserStatus - Invited, Active, Suspended, Deactivated
        - id: T-01-1.1.1.2
          name: Define Credential aggregate with hash storage
          subtasks:
          - id: S-01-1.1.1.2.1
            name: Argon2id password hashing, never plaintext or reversible
          - id: S-01-1.1.1.2.2
            name: CredentialKind - Password, ApiKey, ExternalProvider
          - id: S-01-1.1.1.2.3
            name: Unit test proving hash verification and rejection
      - id: WI-01-1.1.2
        name: Session aggregate
        scope:
          projects:
          - Nexus.Platform.Identity
          schemas:
          - core
          contracts: []
        tasks:
        - id: T-01-1.1.2.1
          name: Define Session with issue, refresh and revoke
          subtasks:
          - id: S-01-1.1.2.1.1
            name: Absolute and sliding expiry
          - id: S-01-1.1.2.1.2
            name: Revocation list honoured on validation
      - id: WI-01-1.1.3
        name: EF configuration and migration
        scope:
          projects:
          - Nexus.Platform.Persistence
          schemas:
          - core
          contracts: []
        tasks:
        - id: T-01-1.1.3.1
          name: IEntityTypeConfiguration per aggregate
        - id: T-01-1.1.3.2
          name: Single clean migration creating the identity schema
      gate: GATE_A
      schema_conflict_group: schema:core
    - id: M-01-1.2
      name: Authentication flow
      phase: P1
      outcome: 'A real user signs in and receives a token that every Nexus host validates.

        '
      depends_on:
      - M-01-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Sign-in with valid credentials returns a signed token.
      - Sign-in with invalid credentials returns 401 and records an audit entry.
      - An expired or revoked token is rejected by every host.
      - Token signing key is resolved through ISecretResolver, never appsettings.
      work_items:
      - id: WI-01-1.2.1
        name: Token issue and validation
        scope:
          projects:
          - Nexus.Platform.Identity
          schemas: []
          contracts:
          - Nexus.Platform.Contracts
        tasks:
        - id: T-01-1.2.1.1
          name: JWT issuance with tenant and permission claims
          subtasks:
          - id: S-01-1.2.1.1.1
            name: Claims include UserId, TenantId, permission set version
          - id: S-01-1.2.1.1.2
            name: Short access token lifetime with refresh
        - id: T-01-1.2.1.2
          name: Shared validation middleware for all hosts
      - id: WI-01-1.2.2
        name: Sign-in endpoint and rate limiting
        scope:
          projects:
          - Nexus.Platform.Identity
          schemas: []
          contracts: []
        tasks:
        - id: T-01-1.2.2.1
          name: POST sign-in with lockout after repeated failure
        - id: T-01-1.2.2.2
          name: Audit every authentication attempt, success and failure
      gate: GATE_A
  - id: F-01-2
    name: Tenancy and Organisation
    phase: P1
    purpose: 'Replace the row-level security that leaves the system when Dataverse is removed. Without
      enforced tenant isolation there is no authorization anywhere in Nexus.

      '
    responsibility: Organisations, tenancy, membership
    milestones:
    - id: M-01-2.1
      name: Organisation and tenant with enforced isolation
      phase: P1
      outcome: 'Every query is tenant-scoped by construction, and cross-tenant access is impossible rather
        than merely discouraged.

        '
      depends_on:
      - M-01-1.2
      parallel_safe: false
      data_introduced:
      - Organisation
      - Tenant
      - TenantMembership
      acceptance:
      - A user in tenant A cannot read tenant B data - proven by an integration test written before the
        implementation.
      - A query that omits the tenant filter fails at build time or throws, rather than returning all
        tenants.
      - ITenantResolver returns the tenant from the token, never a constant.
      work_items:
      - id: WI-01-2.1.1
        name: Organisation and Tenant aggregates
        scope:
          projects:
          - Nexus.Platform.Identity
          schemas:
          - core
          contracts: []
        tasks:
        - id: T-01-2.1.1.1
          name: Define Organisation and Tenant with membership
        - id: T-01-2.1.1.2
          name: Real ITenantResolver over the token principal
      - id: WI-01-2.1.2
        name: Query-level tenant enforcement
        scope:
          projects:
          - Nexus.Platform.Persistence
          schemas:
          - core
          contracts: []
        tasks:
        - id: T-01-2.1.2.1
          name: EF global query filter on every tenant-owned entity
          subtasks:
          - id: S-01-2.1.2.1.1
            name: ITenantOwned marker interface applied by convention
          - id: S-01-2.1.2.1.2
            name: Architecture test failing any ITenantOwned type without a filter
        - id: T-01-2.1.2.2
          name: Cross-tenant denial integration test - write this first
      gate: GATE_A
      schema_conflict_group: schema:core
  - id: F-01-3
    name: Authorization
    phase: P1
    purpose: 'Turn permissions from placeholders into evaluated decisions, so approvals and reviews in
      Developer mean something.

      '
    responsibility: Authorization, roles, permissions, policies
    milestones:
    - id: M-01-3.1
      name: Roles, permissions and evaluation
      phase: P1
      outcome: 'Every endpoint''s access decision is computed from the caller''s roles, not stubbed.

        '
      depends_on:
      - M-01-2.1
      parallel_safe: true
      data_introduced:
      - Role
      - Permission
      - RoleAssignment
      acceptance:
      - IAuthorizationService evaluates a real permission set.
      - Every Experience and Developer endpoint rejects unauthenticated requests.
      - A user without a permission receives 403 and an audit entry is recorded.
      - ChatTurnIdentity returns real values - no hardcoded tenant, no placeholder permissions.
      work_items:
      - id: WI-01-3.1.1
        name: Role and permission model
        scope:
          projects:
          - Nexus.Platform.Authorization
          schemas:
          - core
          contracts:
          - Nexus.Platform.Contracts
        tasks:
        - id: T-01-3.1.1.1
          name: Define Role, Permission, RoleAssignment
        - id: T-01-3.1.1.2
          name: Permission evaluation with role inheritance
      - id: WI-01-3.1.2
        name: Endpoint enforcement
        scope:
          projects:
          - Nexus.Platform.Authorization
          schemas: []
          contracts: []
        tasks:
        - id: T-01-3.1.2.1
          name: Authorization filter applied by default, opt-out per endpoint
        - id: T-01-3.1.2.2
          name: Replace ChatTurnIdentity placeholder implementation
      gate: GATE_A
      schema_conflict_group: schema:core
    - id: M-01-3.2
      name: Policy-based and attribute-based rules
      phase: P3
      outcome: Access decisions can depend on resource attributes, not only roles.
      depends_on:
      - M-01-3.1
      parallel_safe: true
      data_introduced:
      - Policy
      - PolicyRule
      acceptance:
      - A policy restricting access by resource owner is expressible without code change.
      schema_conflict_group: schema:core
  - id: F-01-4
    name: Audit and Usage
    phase: P1
    purpose: 'Make parallel work reviewable and AI cost enforceable. Both are currently console output
      and in-memory counters that vanish on restart.

      '
    responsibility: Audit, usage metering, quota
    milestones:
    - id: M-01-4.1
      name: Durable audit log
      phase: P1
      outcome: 'ConsoleAuditLog is replaced by a queryable store, so who did what is answerable after
        the fact.

        '
      depends_on:
      - M-01-1.1
      parallel_safe: true
      data_introduced:
      - AuditEntry
      acceptance:
      - Audit entries are queryable by user, tenant, action and date range.
      - Every authentication, authorization denial and privileged action writes one.
      - ConsoleAuditLog remains only as a test double.
      work_items:
      - id: WI-01-4.1.1
        name: SQL-backed IAuditLog
        scope:
          projects:
          - Nexus.Platform.Core
          schemas:
          - core
          contracts: []
        tasks:
        - id: T-01-4.1.1.1
          name: AuditEntry aggregate and append-only write path
        - id: T-01-4.1.1.2
          name: Query API by actor, action, resource and window
      gate: GATE_A
      schema_conflict_group: schema:core
    - id: M-01-4.2
      name: Durable usage metering
      phase: P2
      outcome: 'Token and cost consumption per tenant survives restart, making parallel AI workers financially
        bounded.

        '
      depends_on:
      - M-01-1.1
      parallel_safe: true
      data_introduced:
      - UsageRecord
      acceptance:
      - Usage aggregates by tenant, product and model over a date range.
      - A quota policy can deny an invocation based on recorded usage.
      - InMemoryUsageMeter remains only as a test double.
      work_items:
      - id: WI-01-4.2.1
        name: SQL-backed IUsageMeter and enforcing IQuotaPolicy
        scope:
          projects:
          - Nexus.Platform.Core
          schemas:
          - core
          contracts: []
        tasks:
        - id: T-01-4.2.1.1
          name: UsageRecord write path on every model invocation
        - id: T-01-4.2.1.2
          name: Replace PermissiveQuotaPolicy with a limit-aware policy
      gate: GATE_B
      schema_conflict_group: schema:core
  - id: F-01-5
    name: Secrets and Configuration
    phase: P0
    purpose: 'CI cannot run and identity cannot sign tokens while credentials live in appsettings files.

      '
    responsibility: Secrets primitives, shared configuration
    milestones:
    - id: M-01-5.1
      name: Real secret resolver
      phase: P0
      outcome: 'No secret is committed to any repository, and CI can obtain what it needs without one.

        '
      depends_on: []
      parallel_safe: true
      data_introduced: []
      acceptance:
      - ISecretResolver resolves from environment and key vault, with a local development fallback.
      - No provider key, connection string or signing key appears in any appsettings file in any repository.
      - A secret scan runs in CI and fails the build on a match.
      work_items:
      - id: WI-01-5.1.1
        name: ISecretResolver implementation
        scope:
          projects:
          - Nexus.Platform.Core
          schemas: []
          contracts:
          - Nexus.Platform.Contracts
        tasks:
        - id: T-01-5.1.1.1
          name: Environment and key vault providers with ordered fallback
        - id: T-01-5.1.1.2
          name: Audit secret resolution without logging the value
      - id: WI-01-5.1.2
        name: Purge existing secrets
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-01-5.1.2.1
          name: Move set-openai-key.ps1 handling to the resolver
        - id: T-01-5.1.2.2
          name: Add secret scanning to the CI pipeline
      gate: GATE_A
  - id: F-01-6
    name: Model Gateway and Routing
    phase: P0
    purpose: 'Give every layer provider-neutral model access, with credentials never leaving Platform.

      '
    responsibility: Model gateway, model registry, model router
    milestones:
    - id: M-01-6.1
      name: OpenAI path verified end to end
      phase: P0
      outcome: 'A real model call succeeds through RoutingModelGateway and its usage is recorded, closing
        the three smoke tests blocked since the V2.1 migration.

        '
      depends_on: []
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A live chat turn returns a model response through the gateway.
      - Usage is recorded with token counts.
      - The assistant message persists and is retrievable after restart.
      work_items:
      - id: WI-01-6.1.1
        name: Restore live provider access
        scope:
          projects:
          - Nexus.Platform.Providers.OpenAI
          schemas: []
          contracts: []
        tasks:
        - id: T-01-6.1.1.1
          name: Add OpenAI credit and confirm key resolution
        - id: T-01-6.1.1.2
          name: Run and record the three outstanding smoke tests
      gate: GATE_A
    - id: M-01-6.2
      name: Multi-provider routing
      phase: P3
      outcome: Model selection can route by cost, latency class and capability across providers.
      depends_on:
      - M-01-6.1
      parallel_safe: true
      data_introduced:
      - ModelRoute
      acceptance:
      - Anthropic, Google, OpenRouter and DeepSeek gateways implement INamedModelGateway.
      - A routing rule selects a cheaper model for a low-latency-class request.
      - Provider failure falls back without failing the turn.
      schema_conflict_group: schema:core
  - id: F-01-7
    name: Tool Gateway
    phase: P3
    purpose: 'Let Intelligence invoke real side-effecting capability under governed permission, replacing
      EmptyToolCatalog and EmptyToolGateway.

      '
    responsibility: Tool registry, tool runtime, side-effect classification
    milestones:
    - id: M-01-7.1
      name: Tool registry and invocation
      phase: P3
      outcome: A registered tool can be invoked by an agent within its permission scope.
      depends_on:
      - M-01-3.1
      parallel_safe: true
      data_introduced:
      - ToolDescriptor
      - ToolInvocationRecord
      acceptance:
      - SideEffectClass gates whether a tool requires approval before execution.
      - Every invocation is audited with arguments and outcome.
      schema_conflict_group: schema:core
  - id: F-01-8
    name: Notifications and Events
    phase: P2
    purpose: 'Give layers a way to inform people and each other without direct coupling.

      '
    responsibility: Notification infrastructure, events foundation
    milestones:
    - id: M-01-8.1
      name: In-process event bus
      phase: P2
      outcome: Layers publish and consume domain events without referencing each other.
      depends_on:
      - M-01-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A Delivery pipeline-completed event reaches Developer without a project reference between them.
      gate: GATE_B
    - id: M-01-8.2
      name: Notification transport
      phase: P3
      outcome: A person can be notified by email or in-app from any layer.
      depends_on:
      - M-01-8.1
      parallel_safe: true
      data_introduced:
      - NotificationChannel
      - NotificationDelivery
      acceptance:
      - An approval request in Developer reaches the reviewer without Developer knowing the transport.
      schema_conflict_group: schema:core
  long_name: universal technical foundation
- id: '02'
  name: DATA
  repo: Nexus.Platform
  schema: data
  projects:
  - Nexus.Data.Contracts
  - Nexus.Data.Core
  - Nexus.Data.Persistence
  - Nexus.Data.Knowledge
  - Nexus.Data.Retrieval
  purpose: 'Govern information, documents and reusable knowledge across Nexus, and provide the structured
    data access foundation every layer builds on.

    '
  owns:
  - Document
  - DocumentVersion
  - DocumentMetadata
  - KnowledgeItem
  - Source
  - Reference
  - Provenance
  - Embedding
  - IndexEntry
  - Classification
  - RetentionPolicy
  - Lineage
  does_not_own:
  - Structured domain facts - it owns the document about them
  - Product data
  - Development state
  depends_on:
  - '01'
  features:
  - id: F-02-1
    name: Persistence Foundation
    phase: P0
    purpose: 'One persistence backend, one migration discipline, one naming convention. Two coexisting
      stacks double the surface area of every parallel change and ship 7.2 MB of unused Dataverse assemblies
      in every build.

      '
    responsibility: Structured data access, migration discipline
    milestones:
    - id: M-02-1.1
      name: Commit Stage 1b
      phase: P0
      outcome: 'The completed and proven Workspace-on-SQL work stops being one machine failure away from
        loss.

        '
      depends_on: []
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Stage 1b is committed and pushed to origin.
      - api_run.log evidence of sequential Ref allocation is preserved in the commit message or an attached
        note.
      work_items:
      - id: WI-02-1.1.1
        name: Commit and push
        scope:
          projects: []
          schemas:
          - product_core
          contracts: []
        tasks:
        - id: T-02-1.1.1.1
          name: Review git status, stage by explicit path, commit, push
          subtasks:
          - id: S-02-1.1.1.1.1
            name: Confirm .git-broken is not staged
      gate: GATE_A
    - id: M-02-1.2
      name: Stage 2a - Project, Conversation, ConversationMessage
      phase: P0
      outcome: The three highest-traffic aggregates are on Azure SQL with hot-path indexes.
      depends_on:
      - M-02-1.1
      parallel_safe: false
      data_introduced:
      - Project
      - Conversation
      - ConversationMessage
      acceptance:
      - Each aggregate round-trips create, read, update through its endpoints.
      - Ref allocation proven sequential for Project.
      - Message listing by conversation uses an index, confirmed by execution plan.
      work_items:
      - id: WI-02-1.2.1
        name: Aggregate configurations and migration
        scope:
          projects:
          - Nexus.Data.Persistence
          schemas:
          - product_core
          - experience
          contracts: []
        tasks:
        - id: T-02-1.2.1.1
          name: IEntityTypeConfiguration for each of the three aggregates
        - id: T-02-1.2.1.2
          name: Hot-path index on ConversationMessage by conversation and sequence
        - id: T-02-1.2.1.3
          name: SQL repository implementations replacing Dataverse equivalents
      gate: GATE_A
      schema_conflict_group: schema:data
    - id: M-02-1.3
      name: Stage 2b and 2c - remaining seven aggregates
      phase: P0
      outcome: All eleven original aggregates resolve to SQL implementations.
      depends_on:
      - M-02-1.2
      parallel_safe: false
      data_introduced:
      - Knowledge
      - Adr
      - WorkItem
      - Artifact
      - Session
      - Branch
      - Snapshot
      acceptance:
      - Every repository interface the domain declares resolves to a SQL implementation.
      - No multiple-cascade-path error - SQL Server error 1785 - on migration apply.
      - Architecture tests green.
      work_items:
      - id: WI-02-1.3.1
        name: Stage 2b - Knowledge, Adr, WorkItem, Artifact
        scope:
          projects:
          - Nexus.Data.Persistence
          schemas:
          - data
          - developer
          contracts: []
        tasks:
        - id: T-02-1.3.1.1
          name: Configure four aggregates with cascade discipline
          subtasks:
          - id: S-02-1.3.1.1.1
            name: Only the owning parent cascades; reference FKs Restrict
          - id: S-02-1.3.1.1.2
            name: Drop the redundant WorkItem.workitempriority column
      - id: WI-02-1.3.2
        name: Stage 2c - Session, Branch, Snapshot
        scope:
          projects:
          - Nexus.Data.Persistence
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-02-1.3.2.1
          name: Resolve the Session-Branch-Snapshot diamond cascade
          subtasks:
          - id: S-02-1.3.2.1.1
            name: Self-references set to NoAction
      gate: GATE_A
      schema_conflict_group: schema:data
    - id: M-02-1.4
      name: Delete Dataverse
      phase: P0
      outcome: 'One persistence stack. The strangler pattern is a means of arriving safely, not a destination.

        '
      depends_on:
      - M-02-1.3
      parallel_safe: false
      data_introduced: []
      acceptance:
      - Microsoft.PowerPlatform.Dataverse.Client appears in no project file.
      - The System.Security.Cryptography.Xml pin is removed.
      - The Nexus:Persistence configuration switch is removed.
      - No Dataverse assembly in any build output - roughly 7.2 MB smaller.
      - All endpoints work; architecture tests green.
      work_items:
      - id: WI-02-1.4.1
        name: Remove Dataverse implementations and references
        scope:
          projects:
          - Nexus.Data.Persistence
          schemas: []
          contracts: []
        tasks:
        - id: T-02-1.4.1.1
          name: Delete Dataverse repositories, mappers, client and context
        - id: T-02-1.4.1.2
          name: Remove package references and the persistence switch
        - id: T-02-1.4.1.3
          name: Confirm build output size reduction
      gate: GATE_A
    - id: M-02-1.5
      name: Layer schema convention
      phase: P1
      outcome: 'Every layer owns a named schema in one NexusPlatform database, so a layer can later be
        split to its own database without renaming anything.

        '
      depends_on:
      - M-02-1.4
      parallel_safe: false
      data_introduced: []
      acceptance:
      - 'Schemas exist and are named for their layer: core, data, governance, ai, automation, product_core,
        developer, delivery, assurance, operations, experience.'
      - A documented rule states which layer owns which schema, and the schema name equals the lowercased
        layer short name.
      - An architecture test fails any configuration writing outside its layer's schema.
      work_items:
      - id: WI-02-1.5.1
        name: Establish and enforce schema ownership
        note: 'The Stage 1b migration created [org].[Workspace]. This milestone moves it to [product_core].[Workspace]
          as part of establishing the convention. Until then, org is the CURRENT schema and product_core
          is the TARGET.

          '
        scope:
          projects:
          - Nexus.Data.Persistence
          schemas:
          - all
          contracts: []
        tasks:
        - id: T-02-1.5.1.1
          name: Create the eleven layer schemas, named for their layers
        - id: T-02-1.5.1.2
          name: Architecture test asserting schema ownership per configuration
      gate: GATE_A
  - id: F-02-2
    name: Document Store
    phase: P1
    purpose: 'Give every layer somewhere to put the written artefact that explains a structured fact,
      so specifications stop living only in repository markdown.

      '
    responsibility: Documents, document versions, metadata
    milestones:
    - id: M-02-2.1
      name: Document with versioning
      phase: P1
      outcome: 'A milestone in Developer can link to the specification that describes it, and that specification
        has a history.

        '
      depends_on:
      - M-02-1.5
      parallel_safe: true
      data_introduced:
      - Document
      - DocumentVersion
      - DocumentMetadata
      - DocumentLink
      acceptance:
      - A document can be created, revised and its prior versions retrieved.
      - A document links to an arbitrary entity by layer, type and id.
      - This architecture report is stored as a Document and linked to the milestones it describes.
      work_items:
      - id: WI-02-2.1.1
        name: Document aggregate and versioning
        scope:
          projects:
          - Nexus.Data.Knowledge
          schemas:
          - data
          contracts:
          - Nexus.Data.Contracts
        tasks:
        - id: T-02-2.1.1.1
          name: Define Document, DocumentVersion, DocumentMetadata
          subtasks:
          - id: S-02-2.1.1.1.1
            name: Immutable versions; the document points at current
          - id: S-02-2.1.1.1.2
            name: Ref computed persisted column DOC-00000001
        - id: T-02-2.1.1.2
          name: Polymorphic DocumentLink to any layer entity
          subtasks:
          - id: S-02-2.1.1.2.1
            name: Link carries layer id, entity type and entity id - no FK
      - id: WI-02-2.1.2
        name: Import the existing document set
        scope:
          projects:
          - Nexus.Data.Knowledge
          schemas:
          - data
          contracts: []
        tasks:
        - id: T-02-2.1.2.1
          name: Import the numbered canonical docs 00-12 and the ADR series
        - id: T-02-2.1.2.2
          name: Establish which file remains authoritative during transition
      gate: GATE_A
      schema_conflict_group: schema:data
  - id: F-02-3
    name: Knowledge Store
    phase: P2
    purpose: 'Separate curated, approved knowledge from raw documents, so retrieval can prefer what has
      been reviewed.

      '
    responsibility: Knowledge items, sources, references, provenance
    milestones:
    - id: M-02-3.1
      name: Knowledge item with approval and provenance
      phase: P2
      outcome: A knowledge item carries a trust level derived from its review state and age.
      depends_on:
      - M-02-2.1
      parallel_safe: true
      data_introduced:
      - KnowledgeItem
      - Source
      - Reference
      - Provenance
      acceptance:
      - Knowledge has an approval lifecycle with a recorded approver.
      - Trust level decays with review age, mapping Authoritative to Approved to Curated to Reported.
      - Every knowledge item traces to a source.
      work_items:
      - id: WI-02-3.1.1
        name: Knowledge aggregate and approval lifecycle
        scope:
          projects:
          - Nexus.Data.Knowledge
          schemas:
          - data
          contracts: []
      - id: WI-02-3.1.2
        name: Provenance and source tracking
        scope:
          projects:
          - Nexus.Data.Knowledge
          schemas:
          - data
          contracts: []
      gate: GATE_B
      schema_conflict_group: schema:data
  - id: F-02-4
    name: Retrieval
    phase: P2
    purpose: 'Make finding the right context a measurable capability rather than a keyword match.

      '
    responsibility: Search, indexing, embeddings, vector retrieval
    milestones:
    - id: M-02-4.1
      name: Full-text and structured search
      phase: P2
      outcome: Documents and knowledge are findable by term, metadata and link.
      depends_on:
      - M-02-3.1
      parallel_safe: true
      data_introduced:
      - IndexEntry
      acceptance:
      - A term search across documents returns ranked results with source links.
      gate: GATE_B
      schema_conflict_group: schema:data
    - id: M-02-4.2
      name: Embeddings and vector retrieval
      phase: P3
      outcome: 'Semantic retrieval replaces keyword ranking as the default, with keyword retained as a
        fallback.

        '
      depends_on:
      - M-02-4.1
      parallel_safe: true
      data_introduced:
      - Embedding
      acceptance:
      - A semantically related document is retrieved where keyword ranking returns nothing.
      - Retrieval quality is compared against KeywordContextRanker on a fixed question set.
      schema_conflict_group: schema:data
    - id: M-02-4.3
      name: RAG orchestration
      phase: P3
      outcome: Intelligence assembles context from retrieval rather than product-supplied bundles alone.
      depends_on:
      - M-02-4.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A turn cites a document neither the product nor the user supplied.
  - id: F-02-5
    name: Data Governance
    phase: P3
    purpose: 'Make classification, retention and lineage properties of the data rather than of whoever
      remembered to apply them.

      '
    responsibility: Classification, retention, lineage, data residency
    milestones:
    - id: M-02-5.1
      name: Classification and retention
      phase: P3
      outcome: Data carries a classification and a retention rule that is actually enforced.
      depends_on:
      - M-02-3.1
      parallel_safe: true
      data_introduced:
      - Classification
      - RetentionPolicy
      acceptance:
      - A retention policy expires data on schedule and records the expiry.
      schema_conflict_group: schema:data
    - id: M-02-5.2
      name: Lineage
      phase: P3
      outcome: A derived record traces back to the records it was derived from.
      depends_on:
      - M-02-5.1
      parallel_safe: true
      data_introduced:
      - Lineage
      acceptance:
      - A knowledge item derived from three documents lists all three.
      schema_conflict_group: schema:data
  - id: F-02-6
    name: Import, Export and Synchronisation
    phase: P3
    purpose: 'Let information enter and leave Nexus without bespoke code per source.

      '
    responsibility: Import/export, synchronisation
    milestones:
    - id: M-02-6.1
      name: Document import and export
      phase: P3
      outcome: Documents move in and out in common formats without loss of metadata.
      depends_on:
      - M-02-2.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A markdown, docx and pdf import preserves title, version and links.
    - id: M-02-6.2
      name: External source synchronisation
      phase: P3
      outcome: An external repository or drive can be kept in sync as a document source.
      depends_on:
      - M-02-6.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A changed external file produces a new DocumentVersion, not a duplicate Document.
  long_name: information, documents, knowledge and retrieval
- id: '03'
  name: GOVERNANCE
  repo: Nexus.Platform
  schema: governance
  projects:
  - Nexus.Governance.Contracts
  - Nexus.Governance.Core
  - Nexus.Governance.Infrastructure
  purpose: 'Govern Nexus and every product through structured registries of ownership, identity, compliance
    and lifecycle, so that what exists, who owns it, what state it is in and what obligations it carries
    has one authoritative answer.

    '
  owns:
  - Product
  - ProductOwnership
  - ProductClassification
  - ProductLifecycleState
  - Technology
  - TechnologyVersion
  - ProductTechnologyUsage
  - Brand
  - Trademark
  - DomainReference
  - DnsRecordReference
  - Certificate
  - ComplianceObligation
  - ComplianceAttestation
  - PrivacyRequirement
  - DataResidencyDeclaration
  - Licence
  - LicenceAssignment
  - ExternalService
  - ExternalServiceDependency
  - ConfigurationEntry
  - Standard
  - StandardConformance
  does_not_own:
  - What is being built — work graph, plans and tasks belong to 07 Developer
  - How software ships — pipelines and environments belong to 08 Delivery & Infrastructure
  - How software runs — telemetry, incidents and health belong to 10 OPERATIONS
  - Document content and storage — 02 Data & Knowledge owns the document, Governance owns the fact of
    compliance
  - Business meaning of a product's features — 11 Products
  depends_on:
  - '01'
  - '02'
  features:
  - id: F-03-1
    name: Product Registry
    phase: P1
    purpose: 'Establish the authoritative Product record so every other layer has a real ProductId to
      reference. Developer''s work graph cannot attribute work without it, so a minimal version lands
      in the Foundation Gate.

      '
    responsibility: 'Product registry and product identity, ownership, classification and lifecycle registration.

      '
    milestones:
    - id: M-03-1.1
      name: Governance schema and Product record
      phase: P1
      outcome: 'A Product row exists in the governance schema with a stable id, name, classification and
        lifecycle state, and can be read by any layer through a contract instead of a hard-coded constant.

        '
      depends_on:
      - M-01-2.1
      - M-02-1.4
      parallel_safe: true
      data_introduced:
      - Product
      - ProductClassification
      - ProductLifecycleState
      acceptance:
      - EF migration creates the governance schema and governance.Product table on a clean NexusPlatform
        database.
      - Creating a Product with a duplicate slug in the same tenant returns a conflict, not a second row.
      - GET by id returns name, slug, classification and lifecycle state for a seeded Product.
      - Every Product row carries the TenantId enforced by M-01-2.1 and a tenant filter test proves cross-tenant
        reads return empty.
      work_items:
      - id: WI-03-1.1.1
        name: Product aggregate and lifecycle model
        scope:
          projects:
          - Nexus.Governance.Core
          schemas: []
          contracts: []
        tasks:
        - id: T-03-1.1.1.1
          name: Define Product aggregate with identity and slug
          subtasks:
          - id: S-03-1.1.1.1.1
            name: Model ProductId as a typed identifier
          - id: S-03-1.1.1.1.2
            name: Enforce slug format and per-tenant uniqueness invariant
        - id: T-03-1.1.1.2
          name: Define classification and lifecycle value objects
          subtasks:
          - id: S-03-1.1.1.2.1
            name: Model ProductLifecycleState as Proposed/Active/Sunsetting/Retired
          - id: S-03-1.1.1.2.2
            name: Model ProductClassification as Internal/Consumer/Business
      - id: WI-03-1.1.2
        name: Governance schema and persistence
        scope:
          projects:
          - Nexus.Governance.Infrastructure
          schemas:
          - governance
          contracts: []
        tasks:
        - id: T-03-1.1.2.1
          name: Add GovernanceDbContext mapped to the governance schema
          subtasks:
          - id: S-03-1.1.2.1.1
            name: Configure Product entity mapping and unique index on TenantId plus Slug
          - id: S-03-1.1.2.1.2
            name: Register the context in platform DI with the shared NexusPlatform connection
        - id: T-03-1.1.2.2
          name: Create the initial governance EF migration
          subtasks:
          - id: S-03-1.1.2.2.1
            name: Generate and review the CREATE SCHEMA plus CREATE TABLE script
          - id: S-03-1.1.2.2.2
            name: Verify migration applies and rolls back on a clean database
      - id: WI-03-1.1.3
        name: Product read and write contract
        scope:
          projects:
          - Nexus.Governance.Contracts
          - Nexus.Governance.Core
          schemas: []
          contracts:
          - IProductRegistry
        tasks:
        - id: T-03-1.1.3.1
          name: Define product query and command contracts
          subtasks:
          - id: S-03-1.1.3.1.1
            name: Define GetProduct, ListProducts and RegisterProduct signatures
          - id: S-03-1.1.3.1.2
            name: Define ProductNotFound and DuplicateSlug failure results
        - id: T-03-1.1.3.2
          name: Implement and test the registry service
          subtasks:
          - id: S-03-1.1.3.2.1
            name: Implement the service over GovernanceDbContext
          - id: S-03-1.1.3.2.2
            name: Add integration tests covering create, read, duplicate and cross-tenant cases
      gate: GATE_A
      schema_conflict_group: schema:governance
    - id: M-03-1.2
      name: IProductRegistry relocated to Governance
      phase: P1
      outcome: 'IProductRegistry no longer lives under Nexus.Platform.Contracts/Identity; it is owned
        by Nexus.Governance.Contracts and every caller compiles against the new location.

        '
      depends_on:
      - M-03-1.1
      parallel_safe: false
      data_introduced: []
      acceptance:
      - No file named IProductRegistry.cs remains under Nexus.Platform.Contracts/Identity.
      - Solution-wide build succeeds with zero references to the old namespace.
      - A grep for the old namespace string across the repository returns no hits outside the migration
        note.
      work_items:
      - id: WI-03-1.2.1
        name: Move the contract
        scope:
          projects:
          - Nexus.Governance.Contracts
          - Nexus.Platform.Contracts
          schemas: []
          contracts:
          - IProductRegistry
        tasks:
        - id: T-03-1.2.1.1
          name: Relocate IProductRegistry into Nexus.Governance.Contracts
          subtasks:
          - id: S-03-1.2.1.1.1
            name: Move the file and change its namespace to Nexus.Governance.Contracts
          - id: S-03-1.2.1.1.2
            name: Reconcile the seed signature with the M-03-1.1 contract shape
        - id: T-03-1.2.1.2
          name: Remove the identity-layer copy and its DI registration
          subtasks:
          - id: S-03-1.2.1.2.1
            name: Delete the old file and any identity-layer stub implementation
          - id: S-03-1.2.1.2.2
            name: Move the DI registration into the Governance module
      - id: WI-03-1.2.2
        name: Update call sites
        scope:
          projects:
          - Nexus.Platform.Contracts
          schemas: []
          contracts:
          - IProductRegistry
        tasks:
        - id: T-03-1.2.2.1
          name: Repoint every consumer to the Governance namespace
          subtasks:
          - id: S-03-1.2.2.1.1
            name: Update using directives and project references across the solution
          - id: S-03-1.2.2.1.2
            name: Add a layering test asserting Platform does not reference Governance
      gate: GATE_A
    - id: M-03-1.3
      name: Product ownership and lifecycle transitions
      phase: P1
      outcome: 'Each Product has a named owner resolved against a real identity, and lifecycle state changes
        only through validated transitions that leave an audit record.

        '
      depends_on:
      - M-03-1.1
      - M-01-1.2
      - M-01-3.1
      parallel_safe: true
      data_introduced:
      - ProductOwnership
      - ProductLifecycleTransition
      acceptance:
      - Registering ownership with a UserId that identity cannot resolve is rejected.
      - A transition from Retired to Active is rejected; Active to Sunsetting succeeds.
      - Every accepted transition writes one audit entry containing actor, from-state, to-state and timestamp.
      - A caller without the product-admin permission from M-01-3.1 receives 403 on transition and ownership
        endpoints.
      work_items:
      - id: WI-03-1.3.1
        name: Ownership records
        scope:
          projects:
          - Nexus.Governance.Core
          - Nexus.Governance.Infrastructure
          schemas:
          - governance
          contracts: []
        tasks:
        - id: T-03-1.3.1.1
          name: Model ProductOwnership against identity principals
          subtasks:
          - id: S-03-1.3.1.1.1
            name: Define owner role values Accountable and Delegate
          - id: S-03-1.3.1.1.2
            name: Validate UserId against the identity resolver before persisting
        - id: T-03-1.3.1.2
          name: Persist ownership and expose it on the product read model
          subtasks:
          - id: S-03-1.3.1.2.1
            name: Add the ProductOwnership table and EF migration
          - id: S-03-1.3.1.2.2
            name: Include current owners in the GetProduct response
      - id: WI-03-1.3.2
        name: Lifecycle transition rules
        scope:
          projects:
          - Nexus.Governance.Core
          schemas: []
          contracts: []
        tasks:
        - id: T-03-1.3.2.1
          name: Implement the allowed-transition table
          subtasks:
          - id: S-03-1.3.2.1.1
            name: Encode allowed transitions as data, not conditionals
          - id: S-03-1.3.2.1.2
            name: Unit test every allowed and every rejected transition pair
        - id: T-03-1.3.2.2
          name: Emit ProductLifecycleChanged for downstream layers
          subtasks:
          - id: S-03-1.3.2.2.1
            name: Define the event payload in Nexus.Governance.Contracts
          - id: S-03-1.3.2.2.2
            name: Publish on commit and assert emission in an integration test
      - id: WI-03-1.3.3
        name: Governance audit trail
        scope:
          projects:
          - Nexus.Governance.Infrastructure
          schemas:
          - governance
          contracts: []
        tasks:
        - id: T-03-1.3.3.1
          name: Route governance changes into the platform audit sink
          subtasks:
          - id: S-03-1.3.3.1.1
            name: Map ownership and lifecycle changes to audit entries
          - id: S-03-1.3.3.1.2
            name: Test that a rejected transition writes no audit entry
      gate: GATE_A
      schema_conflict_group: schema:governance
  - id: F-03-2
    name: Technology Registry
    phase: P3
    purpose: 'Record which technologies and versions Nexus and its products depend on, so upgrade, end-of-life
      and exposure questions can be answered from data rather than from memory.

      '
    responsibility: 'Technology registry.

      '
    milestones:
    - id: M-03-2.1
      name: Technology catalogue
      phase: P3
      outcome: 'Technologies and their versions are registered with support windows and end-of-life dates.

        '
      depends_on:
      - M-03-1.1
      parallel_safe: true
      data_introduced:
      - Technology
      - TechnologyVersion
      acceptance:
      - Registering a TechnologyVersion with an end-of-life date earlier than its release date is rejected.
      - A query for versions past end-of-life as of a given date returns exactly the expired set in a
        seeded fixture.
      schema_conflict_group: schema:governance
    - id: M-03-2.2
      name: Product technology usage
      phase: P3
      outcome: 'Each Product declares the technology versions it uses, so an end-of-life version resolves
        to a list of affected products.

        '
      depends_on:
      - M-03-2.1
      - M-03-1.3
      parallel_safe: false
      data_introduced:
      - ProductTechnologyUsage
      acceptance:
      - Given a TechnologyVersion id, the affected-products query returns every product with an active
        usage link.
      - Deleting a TechnologyVersion still referenced by a usage link is rejected.
      schema_conflict_group: schema:governance
  - id: F-03-3
    name: Brand, Domain and Certificate Registry
    phase: P3
    purpose: 'Hold the authoritative reference for brand and trademark identity, the domains and DNS entries
      a product presents on, and the certificates that secure them, so nothing expires unnoticed and nothing
      ships unbranded.

      '
    responsibility: 'Brand, trademark, domain and DNS references, and certificate lifecycle.

      '
    milestones:
    - id: M-03-3.1
      name: Brand and trademark records
      phase: P3
      outcome: 'Each Product resolves to its brand, and trademark registrations with jurisdiction and
        renewal dates are recorded.

        '
      depends_on:
      - M-03-1.1
      parallel_safe: true
      data_introduced:
      - Brand
      - Trademark
      acceptance:
      - A Product can be linked to exactly one primary Brand; a second primary link is rejected.
      - A trademark renewal-due query returns registrations with renewal dates inside a supplied window.
      schema_conflict_group: schema:governance
    - id: M-03-3.2
      name: Domain and DNS references
      phase: P3
      outcome: 'Domains and their DNS record references are registered against products and brands, with
        the registrar and expiry date recorded.

        '
      depends_on:
      - M-03-3.1
      parallel_safe: false
      data_introduced:
      - DomainReference
      - DnsRecordReference
      acceptance:
      - Registering the same fully qualified domain twice returns a conflict.
      - A domain-expiry report lists domains expiring within N days for a seeded fixture.
      - DNS records are stored as references only; no record in the registry contains a secret value.
      schema_conflict_group: schema:governance
    - id: M-03-3.3
      name: Certificate lifecycle
      phase: P3
      outcome: 'Certificates are registered against domains with issuer, thumbprint and expiry, and expiry
        warnings are emitted as events other layers can act on.

        '
      depends_on:
      - M-03-3.2
      - M-01-8.1
      parallel_safe: false
      data_introduced:
      - Certificate
      - CertificateExpiryWarning
      acceptance:
      - Registering a certificate whose expiry is in the past sets its state to Expired on write.
      - A CertificateExpiring event is emitted once per certificate crossing the configured warning threshold.
      - Certificate private material is never stored in the governance schema; only the thumbprint and
        a secret reference.
      schema_conflict_group: schema:governance
  - id: F-03-4
    name: Compliance and Privacy Registry
    phase: P3
    purpose: 'Record the obligations each product carries, the privacy requirements and residency constraints
      that apply to its data, and the attestations that evidence them.

      '
    responsibility: 'Compliance registry, privacy requirements and data residency.

      '
    milestones:
    - id: M-03-4.1
      name: Compliance obligation catalogue
      phase: P3
      outcome: 'Obligations are defined once and applied to products, so each product resolves to a concrete
        obligation list.

        '
      depends_on:
      - M-03-1.3
      parallel_safe: true
      data_introduced:
      - ComplianceObligation
      - ProductObligation
      acceptance:
      - A product's obligation list returns every obligation applied directly and by classification rule.
      - Retiring an obligation leaves historical product links intact and marks them Superseded.
      schema_conflict_group: schema:governance
    - id: M-03-4.2
      name: Privacy requirements and data residency
      phase: P3
      outcome: 'Each product declares its residency region and the privacy requirements applying to the
        data it holds.

        '
      depends_on:
      - M-03-4.1
      parallel_safe: false
      data_introduced:
      - PrivacyRequirement
      - DataResidencyDeclaration
      acceptance:
      - A product without a residency declaration fails the governance readiness check.
      - Declaring a residency region outside the configured allowed set is rejected.
      schema_conflict_group: schema:governance
    - id: M-03-4.3
      name: Attestation and evidence references
      phase: P3
      outcome: 'An obligation can be attested by a named owner with an evidence reference into Data &
        Knowledge, and stale attestations are visible.

        '
      depends_on:
      - M-03-4.2
      parallel_safe: false
      data_introduced:
      - ComplianceAttestation
      - EvidenceReference
      acceptance:
      - An attestation stores a DocumentId reference; no document bytes are written to the governance
        schema.
      - An attestation older than its obligation's review interval is reported as Stale.
      - Attesting on behalf of another user without delegation permission is rejected.
      schema_conflict_group: schema:governance
  - id: F-03-5
    name: Licence and External Service Registry
    phase: P3
    purpose: 'Track the licences Nexus holds or grants and the external services it depends on, so cost,
      renewal and third-party exposure have one source.

      '
    responsibility: 'Licence registry and external service registry.

      '
    milestones:
    - id: M-03-5.1
      name: Licence registry
      phase: P3
      outcome: 'Licences are registered with type, seat count, term and renewal date, and assigned to
        products or teams.

        '
      depends_on:
      - M-03-1.3
      parallel_safe: true
      data_introduced:
      - Licence
      - LicenceAssignment
      acceptance:
      - Assigning more seats than the licence holds is rejected.
      - A renewal report lists licences with a renewal date inside a supplied window.
      schema_conflict_group: schema:governance
    - id: M-03-5.2
      name: External service registry
      phase: P3
      outcome: 'Every third-party service a product depends on is registered with its owner, criticality
        and data-sharing classification.

        '
      depends_on:
      - M-03-5.1
      - M-03-4.2
      parallel_safe: false
      data_introduced:
      - ExternalService
      - ExternalServiceDependency
      acceptance:
      - A service marked as receiving personal data cannot be linked to a product lacking a privacy requirement.
      - Given a service id, the dependency query returns every product depending on it with its criticality.
      schema_conflict_group: schema:governance
  - id: F-03-6
    name: Configuration Registry and Standards Governance
    phase: P3
    purpose: 'Hold the non-secret configuration facts that describe how a product is set up, and the standards
      it is expected to conform to, with conformance checked rather than assumed.

      '
    responsibility: 'Configuration registry and standards governance.

      '
    milestones:
    - id: M-03-6.1
      name: Configuration registry
      phase: P3
      outcome: 'Configuration entries are registered per product and environment with typed values and
        secret references, never secret values.

        '
      depends_on:
      - M-03-1.3
      parallel_safe: true
      data_introduced:
      - ConfigurationEntry
      - ConfigurationScope
      acceptance:
      - Writing a value to an entry marked IsSecret is rejected; only a secret reference is accepted.
      - Reading configuration for a product and environment returns environment values overriding product
        defaults.
      schema_conflict_group: schema:governance
    - id: M-03-6.2
      name: Standards governance and conformance
      phase: P3
      outcome: 'Standards are declared, applied to products, and evaluated to a recorded conformance result
        that CI can read.

        '
      depends_on:
      - M-03-6.1
      - M-08-2.1
      parallel_safe: false
      data_introduced:
      - Standard
      - StandardApplication
      - StandardConformance
      acceptance:
      - A conformance evaluation records Pass, Fail or NotApplicable with an evaluated-at timestamp for
        each applied standard.
      - A CI job can fetch a product's conformance summary and fail the build on any Fail result.
      - Removing a standard from a product retains prior conformance records as history.
      schema_conflict_group: schema:governance
  long_name: registries of products, technology, brand, compliance
- id: '04'
  name: AI
  repo: Nexus.Intelligence
  schema: ai
  projects:
  - Nexus.Intelligence.Contracts
  - Nexus.Intelligence.Core
  - Nexus.Intelligence.Context
  - Nexus.Intelligence.Memory
  - Nexus.Intelligence.Agents
  - Nexus.Intelligence.Evaluation
  - Nexus.Intelligence.Api
  purpose: 'Provide reusable AI reasoning, model access, agents and intelligent capability to every layer
    and product, without any consumer''s structure leaking into it.

    '
  owns:
  - Agent
  - AgentCapability
  - Prompt
  - PromptVersion
  - ModelRoute
  - MemoryRecord
  - TurnTrace
  - Evaluation
  - Guardrail
  - ResultReport
  does_not_own:
  - Product data
  - Conversation storage - Layer 11 EXPERIENCE owns that
  - Documents
  - Provider credentials - Layer 01 holds those
  - Any knowledge of what a Workspace or Milestone is
  depends_on:
  - '01'
  - '02'
  invariant: 'Consumers flatten their entities into ContextItem and hand over a ContextBundle. ScopeRef
    is opaque to Intelligence. This seam is the best-designed boundary in the system and must not be broken
    to make any feature easier.

    '
  features:
  - id: F-04-1
    name: Durable Turn State
    phase: P0
    purpose: 'Everything stateful in Intelligence is currently in-memory. Nothing survives a restart,
      so the Result Loop cannot exist and Developer cannot later explain why it made a call.

      '
    responsibility: AI observability, memory engine, result validation
    milestones:
    - id: M-04-1.1
      name: Durable turn trace and result report
      phase: P0
      outcome: 'A turn''s reasoning is retrievable after the process that produced it has gone.

        '
      depends_on:
      - M-02-1.4
      parallel_safe: true
      data_introduced:
      - TurnTrace
      - ResultReport
      acceptance:
      - A turn trace is retrievable by turn id after a host restart.
      - A result report is retrievable by id after a host restart.
      - InMemoryTurnTraceStore and InMemoryResultReportStore remain only as test doubles.
      work_items:
      - id: WI-04-1.1.1
        name: SQL-backed ITurnTraceStore
        scope:
          projects:
          - Nexus.Intelligence.Core
          schemas:
          - ai
          contracts: []
        tasks:
        - id: T-04-1.1.1.1
          name: TurnTrace persistence with decision trace and usage summary
          subtasks:
          - id: S-04-1.1.1.1.1
            name: Store intent, policy verdict, selected context ids, model, tokens
          - id: S-04-1.1.1.1.2
            name: Retention window so traces do not grow without bound
      - id: WI-04-1.1.2
        name: SQL-backed IResultReportStore
        scope:
          projects:
          - Nexus.Intelligence.Api
          schemas:
          - ai
          contracts: []
        tasks:
        - id: T-04-1.1.2.1
          name: ResultReport persistence and retrieval endpoint
      gate: GATE_A
      schema_conflict_group: schema:ai
    - id: M-04-1.2
      name: Durable memory store
      phase: P2
      outcome: Memory persists across sessions, making context genuinely cumulative.
      depends_on:
      - M-04-1.1
      parallel_safe: false
      data_introduced:
      - MemoryRecord
      acceptance:
      - A memory written in one session is retrievable in the next.
      - Memory is scoped by tenant and by MemoryKind.
      - InMemoryMemoryStore remains only as a test double.
      work_items:
      - id: WI-04-1.2.1
        name: SQL-backed IMemoryStore
        scope:
          projects:
          - Nexus.Intelligence.Memory
          schemas:
          - ai
          contracts: []
        tasks:
        - id: T-04-1.2.1.1
          name: MemoryRecord persistence honouring MemoryQuery
        - id: T-04-1.2.1.2
          name: Tenant scoping on every read path
      gate: GATE_B
      schema_conflict_group: schema:ai
  - id: F-04-2
    name: Context Engine
    phase: P0
    purpose: 'Until citations render and are proven, every intelligence change - ranking weights, trust
      levels, prompt section order - is unfalsifiable. Swagger can tell you an endpoint returned 200;
      it cannot tell you the context was good.

      '
    responsibility: Context engine, prompt management
    milestones:
    - id: M-04-2.1
      name: Citations proven against a live model
      phase: P0
      outcome: 'A real chat turn in a browser shows the answer and which context produced it, closing
        the loop the frontend already built.

        '
      depends_on:
      - M-01-6.1
      - M-04-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A live turn returns citations that resolve to real context items.
      - The citations panel renders them in the browser.
      - A context item removed from the bundle disappears from the citations.
      work_items:
      - id: WI-04-2.1.1
        name: End-to-end citation verification
        scope:
          projects:
          - Nexus.Intelligence.Context
          schemas: []
          contracts: []
        tasks:
        - id: T-04-2.1.1.1
          name: Verify citation ids survive the full pipeline to the client
        - id: T-04-2.1.1.2
          name: Record a baseline answer set for later ranking comparison
      gate: GATE_A
    - id: M-04-2.2
      name: Prompt versioning
      phase: P3
      outcome: A prompt change is a versioned, comparable event rather than an edit.
      depends_on:
      - M-04-2.1
      parallel_safe: true
      data_introduced:
      - Prompt
      - PromptVersion
      acceptance:
      - Two prompt versions can be compared on the same question set.
      schema_conflict_group: schema:ai
  - id: F-04-3
    name: Agents
    phase: P1
    purpose: 'Give Developer an agent that can reason about the work graph, and establish the pattern
      every later agent follows.

      '
    responsibility: Agent registry, agent runtime
    milestones:
    - id: M-04-3.1
      name: Developer agent
      phase: P1
      outcome: 'DeveloperAgent stops being a 974-byte stub and can answer questions about work, dependencies
        and parallel safety using supplied context.

        '
      depends_on:
      - M-07-2.1
      - M-04-1.1
      parallel_safe: true
      data_introduced:
      - Agent
      - AgentCapability
      acceptance:
      - The agent answers which work items are safe to run together, given a bundle.
      - Its answer cites the dependency records it reasoned from.
      - It receives only ContextItems - it has no reference to Developer types.
      work_items:
      - id: WI-04-3.1.1
        name: DeveloperAgent implementation
        scope:
          projects:
          - Nexus.Intelligence.Agents
          schemas:
          - ai
          contracts: []
        tasks:
        - id: T-04-3.1.1.1
          name: Implement IAgent over the work-graph context kinds
        - id: T-04-3.1.1.2
          name: Register capability metadata for agent selection
      gate: GATE_A
      schema_conflict_group: schema:ai
    - id: M-04-3.2
      name: Agent runtime with tool access
      phase: P3
      outcome: An agent can take governed action, not only produce text.
      depends_on:
      - M-01-7.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - An agent invokes a registered tool and the invocation is audited.
  - id: F-04-4
    name: Model Selection and Routing
    phase: P2
    purpose: 'Choose the right model per task rather than per configuration file, and make the cost of
      that choice visible.

      '
    responsibility: Model router, usage metering, cost accounting
    milestones:
    - id: M-04-4.1
      name: Per-turn cost attribution
      phase: P2
      outcome: Every turn's cost is attributable to a tenant, a product and a work item.
      depends_on:
      - M-01-4.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A Developer run reports the model spend it incurred.
      work_items:
      - id: WI-04-4.1.1
        name: Cost attribution through the turn pipeline
        scope:
          projects:
          - Nexus.Intelligence.Core
          schemas:
          - ai
          contracts: []
      gate: GATE_B
    - id: M-04-4.2
      name: Capability and cost-aware routing
      phase: P3
      outcome: Model selection considers capability, latency class and price.
      depends_on:
      - M-01-6.2
      - M-04-4.1
      parallel_safe: true
      data_introduced:
      - ModelRoute
      acceptance:
      - A classification task routes to a cheaper model than a reasoning task.
      schema_conflict_group: schema:ai
  - id: F-04-5
    name: Evaluation and Guardrails
    phase: P3
    purpose: 'Make AI quality a measured property. Without this, every claim about improvement is an anecdote.

      '
    responsibility: Evaluations, guardrails, AI result validation
    milestones:
    - id: M-04-5.1
      name: Evaluation harness
      phase: P3
      outcome: A change to ranking, prompt or model is scored against a fixed question set.
      depends_on:
      - M-04-2.2
      parallel_safe: true
      data_introduced:
      - Evaluation
      - EvaluationRun
      acceptance:
      - A regression in answer quality fails a pipeline.
      schema_conflict_group: schema:ai
    - id: M-04-5.2
      name: Guardrails and output validation
      phase: P3
      outcome: Unsafe or malformed model output is caught before it reaches a consumer.
      depends_on:
      - M-04-5.1
      parallel_safe: true
      data_introduced:
      - Guardrail
      acceptance:
      - A structured-output contract violation is rejected and retried, not surfaced.
      schema_conflict_group: schema:ai
    - id: M-04-5.3
      name: Result loop
      phase: P5
      outcome: 'Advice is linked to its actual outcome, so Nexus can learn which of its own recommendations
        worked.

        '
      depends_on:
      - M-04-5.1
      - M-07-5.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A proposed action is traceable to the development result it produced.
  long_name: reasoning, agents, context, models
  project_naming_note: Layer short name is AI. Technical assemblies remain Nexus.Intelligence.* - stable
    technical names are not changed without technical value. No rename work exists.
- id: '05'
  name: AUTOMATION
  repo: Nexus.Platform
  schema: automation
  projects:
  - Nexus.Automation.Contracts
  - Nexus.Automation.Core
  - Nexus.Automation.Infrastructure
  purpose: 'Execute reliable repeatable processes independently of whether AI is used, on the principle
    that Intelligence reasons and Automation executes.

    '
  owns:
  - WorkflowDefinition
  - WorkflowVersion
  - WorkflowInstance
  - WorkflowStep
  - WorkflowResult
  - Rule
  - Condition
  - Trigger
  - Schedule
  - StateMachineDefinition
  - StateTransition
  - Queue
  - Job
  - JobAttempt
  - RetryPolicy
  - ApprovalGate
  - ApprovalDecision
  - EscalationPolicy
  - EventHandler
  - ProcessOrchestration
  does_not_own:
  - The business meaning of what it runs — the owning layer or product defines that
  - Reasoning, planning or model calls — 04 Intelligence
  - What work exists to be done — 07 Developer owns the work graph
  - Deployment mechanics — 08 Delivery & Infrastructure
  - Runtime telemetry and incidents — 09 Operations
  depends_on:
  - '01'
  - '02'
  - '03'
  features:
  - id: F-05-1
    name: Job Runner
    phase: P2
    purpose: 'Give Developer V1b a deterministic place to put retry and escalation when it dispatches
      autonomous workers. This is the minimal execution substrate; full workflow arrives in P3.

      '
    responsibility: 'Queues, jobs, retries and escalations.

      '
    milestones:
    - id: M-05-1.1
      name: Automation schema and job store
      phase: P2
      outcome: 'A job can be enqueued, persisted and read back with its state and attempt history surviving
        a process restart.

        '
      depends_on:
      - M-01-2.1
      - M-02-1.4
      - M-03-1.1
      parallel_safe: true
      data_introduced:
      - Queue
      - Job
      - JobAttempt
      - JobState
      acceptance:
      - EF migration creates the automation schema and its tables on a clean NexusPlatform database.
      - A job enqueued before a host restart is still Pending and claimable after the restart.
      - Job rows carry TenantId and ProductId, and a job referencing an unknown ProductId is rejected.
      - Enqueuing with the same idempotency key twice yields one job row.
      work_items:
      - id: WI-05-1.1.1
        name: Job and queue model
        scope:
          projects:
          - Nexus.Automation.Core
          schemas: []
          contracts: []
      - id: WI-05-1.1.2
        name: Automation schema and EF migration
        scope:
          projects:
          - Nexus.Automation.Infrastructure
          schemas:
          - automation
          contracts: []
      - id: WI-05-1.1.3
        name: Enqueue and query contracts
        scope:
          projects:
          - Nexus.Automation.Contracts
          schemas: []
          contracts:
          - IJobQueue
      gate: GATE_B
      schema_conflict_group: schema:automation
    - id: M-05-1.2
      name: Dispatch loop with retry and backoff
      phase: P2
      outcome: 'Jobs are claimed by exactly one worker, executed, and failures are retried under a declared
        policy instead of ad hoc caller logic.

        '
      depends_on:
      - M-05-1.1
      parallel_safe: false
      data_introduced:
      - RetryPolicy
      - JobLease
      acceptance:
      - Two concurrent dispatchers claiming the same queue never execute the same job twice, proven by
        a contention test.
      - A handler throwing three times against a max-three policy leaves the job in Failed, with three
        JobAttempt rows.
      - Retry delays follow the configured exponential backoff within a stated tolerance.
      - A worker that dies mid-job releases its lease after the visibility timeout and the job is reclaimed.
      work_items:
      - id: WI-05-1.2.1
        name: Atomic claim and lease renewal
        scope:
          projects:
          - Nexus.Automation.Infrastructure
          schemas:
          - automation
          contracts: []
      - id: WI-05-1.2.2
        name: Retry policy evaluation and backoff
        scope:
          projects:
          - Nexus.Automation.Core
          schemas: []
          contracts: []
      - id: WI-05-1.2.3
        name: Hosted dispatcher and handler registration
        scope:
          projects:
          - Nexus.Automation.Infrastructure
          - Nexus.Automation.Contracts
          schemas: []
          contracts:
          - IJobHandler
      gate: GATE_B
      schema_conflict_group: schema:automation
    - id: M-05-1.3
      name: Escalation and dead-letter
      phase: P2
      outcome: 'A job that exhausts its retries lands in a dead-letter queue and raises an escalation
        event Developer can act on, rather than being lost.

        '
      depends_on:
      - M-05-1.2
      - M-07-1.1
      - M-01-8.1
      parallel_safe: false
      data_introduced:
      - DeadLetterEntry
      - EscalationEvent
      acceptance:
      - A job exceeding its retry budget produces exactly one DeadLetterEntry retaining the original payload
        and last error.
      - A JobEscalated event is published with JobId, queue, attempt count and last error.
      - A dead-lettered job can be replayed and executes as a new job with a link back to the original
        id.
      work_items:
      - id: WI-05-1.3.1
        name: Dead-letter queue and replay
        scope:
          projects:
          - Nexus.Automation.Core
          - Nexus.Automation.Infrastructure
          schemas:
          - automation
          contracts: []
      - id: WI-05-1.3.2
        name: Escalation events for Developer dispatch
        scope:
          projects:
          - Nexus.Automation.Contracts
          schemas: []
          contracts:
          - IEscalationPublisher
      gate: GATE_B
      schema_conflict_group: schema:automation
  - id: F-05-2
    name: Workflow Definitions and Instances
    phase: P3
    purpose: 'Move from single jobs to multi-step processes that can be defined once, versioned, and executed
      many times with durable state.

      '
    responsibility: 'Workflow definitions and instances, and workflow results.

      '
    milestones:
    - id: M-05-2.1
      name: Workflow definition and versioning
      phase: P3
      outcome: 'A workflow is defined as durable data with immutable published versions, so a running
        instance is never changed underneath.

        '
      depends_on:
      - M-05-1.3
      parallel_safe: true
      data_introduced:
      - WorkflowDefinition
      - WorkflowVersion
      - WorkflowStep
      acceptance:
      - Editing a published WorkflowVersion is rejected; editing a draft succeeds.
      - A definition whose step graph contains a cycle fails validation on publish.
      - Publishing produces a new version number and leaves prior versions readable.
      schema_conflict_group: schema:automation
    - id: M-05-2.2
      name: Instance execution and durable state
      phase: P3
      outcome: 'Workflow instances execute step by step on the job runner, and an instance resumes at
        the correct step after a restart.

        '
      depends_on:
      - M-05-2.1
      parallel_safe: false
      data_introduced:
      - WorkflowInstance
      - StepExecution
      acceptance:
      - An instance killed mid-run resumes at the first incomplete step and does not re-run completed
        steps.
      - Each step execution records started-at, ended-at and outcome.
      - An instance pinned to WorkflowVersion 2 continues on version 2 after version 3 is published.
      schema_conflict_group: schema:automation
    - id: M-05-2.3
      name: Workflow results and history
      phase: P3
      outcome: 'Every completed instance yields a queryable result and a full step history that a caller
        can inspect without reading logs.

        '
      depends_on:
      - M-05-2.2
      parallel_safe: false
      data_introduced:
      - WorkflowResult
      - WorkflowHistoryEntry
      acceptance:
      - A completed instance exposes a typed result with Succeeded, Failed or Cancelled and a terminal
        reason.
      - The history endpoint returns steps in execution order with inputs and outputs redacted per configuration.
      - History is retained for the configured window and purged after it, proven by a retention test.
      schema_conflict_group: schema:automation
  - id: F-05-3
    name: Triggers, Schedules and Events
    phase: P3
    purpose: 'Start work without a human pressing a button, on a clock or in reaction to something that
      happened elsewhere in the platform.

      '
    responsibility: 'Triggers, schedules and event handlers.

      '
    milestones:
    - id: M-05-3.1
      name: Schedule engine
      phase: P3
      outcome: 'Workflows and jobs run on recurring and one-shot schedules, with missed occurrences handled
        by a declared catch-up policy.

        '
      depends_on:
      - M-05-2.2
      parallel_safe: true
      data_introduced:
      - Schedule
      - ScheduleOccurrence
      acceptance:
      - A cron schedule fires at the expected UTC instants across a daylight-saving boundary in a simulated
        clock test.
      - With catch-up disabled, a schedule missed during downtime produces one occurrence, not the full
        backlog.
      - Two hosts running the scheduler produce exactly one occurrence per due instant.
      schema_conflict_group: schema:automation
    - id: M-05-3.2
      name: Event handlers and trigger bindings
      phase: P3
      outcome: 'Platform events can be bound to workflow starts through declared trigger bindings with
        filter conditions.

        '
      depends_on:
      - M-05-3.1
      - M-01-8.1
      parallel_safe: false
      data_introduced:
      - Trigger
      - EventHandler
      - TriggerBinding
      acceptance:
      - A ProductLifecycleChanged event with a matching filter starts exactly one workflow instance.
      - An event that matches no binding is recorded as unhandled and does not throw.
      - Redelivery of the same event id does not start a second instance.
      schema_conflict_group: schema:automation
  - id: F-05-4
    name: Rules, Conditions and State Machines
    phase: P3
    purpose: 'Express branching and lifecycle logic as evaluated data rather than as code inside each
      product, so behaviour can be changed without redeploy.

      '
    responsibility: 'Rules, conditions and state machines.

      '
    milestones:
    - id: M-05-4.1
      name: Rule and condition evaluation
      phase: P3
      outcome: 'Conditions are declared, evaluated against a typed context, and their results are explainable.

        '
      depends_on:
      - M-05-2.2
      parallel_safe: true
      data_introduced:
      - Rule
      - Condition
      - RuleEvaluation
      acceptance:
      - Evaluating a rule returns the boolean result plus the operand values that produced it.
      - A condition referencing a field absent from the context fails validation at save time, not at
        run time.
      - Evaluation is side-effect free, proven by a test asserting no writes outside the evaluation record.
      schema_conflict_group: schema:automation
    - id: M-05-4.2
      name: State machine definitions and transitions
      phase: P3
      outcome: 'Entities in any layer can be driven through a declared state machine whose transitions
        are guarded by rules and recorded.

        '
      depends_on:
      - M-05-4.1
      parallel_safe: false
      data_introduced:
      - StateMachineDefinition
      - StateTransition
      - TransitionRecord
      acceptance:
      - A transition whose guard rule evaluates false is rejected with the failing condition named.
      - A definition with an unreachable state fails validation on publish.
      - Every accepted transition writes one TransitionRecord with actor, from-state and to-state.
      schema_conflict_group: schema:automation
  - id: F-05-5
    name: Approvals and Human-in-the-Loop
    phase: P3
    purpose: 'Let a process pause for a human decision and resume deterministically, with escalation when
      the human does not respond.

      '
    responsibility: 'Approvals, human-in-the-loop gates and escalations.

      '
    milestones:
    - id: M-05-5.1
      name: Approval gates
      phase: P3
      outcome: 'A workflow step can block on a decision from a named approver and resume on approve, reject
        or timeout.

        '
      depends_on:
      - M-05-2.2
      - M-01-3.1
      parallel_safe: true
      data_introduced:
      - ApprovalGate
      - ApprovalDecision
      acceptance:
      - An instance at an approval gate reports state AwaitingApproval and consumes no worker lease.
      - A decision submitted by a user outside the approver set is rejected with 403.
      - Approve resumes the next step; reject drives the instance to Failed with reason Rejected.
      - A second decision on an already-decided gate is rejected as a conflict.
      schema_conflict_group: schema:automation
    - id: M-05-5.2
      name: Escalation policies and reminders
      phase: P3
      outcome: 'Undecided approvals escalate along a declared chain with reminders, instead of stalling
        indefinitely.

        '
      depends_on:
      - M-05-5.1
      parallel_safe: false
      data_introduced:
      - EscalationPolicy
      - EscalationStep
      - Reminder
      acceptance:
      - A gate untouched past its reminder interval emits exactly one reminder per interval, capped at
        the configured maximum.
      - After the final escalation step the gate resolves to its declared default outcome and the instance
        continues.
      - The escalation chain is recorded on the gate so who was asked and when is answerable.
      schema_conflict_group: schema:automation
  - id: F-05-6
    name: Queues and Process Orchestration
    phase: P3
    purpose: 'Control throughput and coordinate multiple workflows into a single longer-running process
      with a shared outcome.

      '
    responsibility: 'Queues and process orchestration.

      '
    milestones:
    - id: M-05-6.1
      name: Named queues with concurrency and priority
      phase: P3
      outcome: 'Work is separated into named queues with per-queue concurrency limits and priority, so
        one noisy producer cannot starve others.

        '
      depends_on:
      - M-05-1.3
      parallel_safe: true
      data_introduced:
      - QueuePolicy
      - ConcurrencyLimit
      acceptance:
      - With a concurrency limit of two, no more than two jobs from that queue are in Running at any sampled
        instant.
      - A high-priority job enqueued behind ten normal jobs is dispatched before them.
      - Pausing a queue leaves jobs Pending and dispatches none until resumed.
      schema_conflict_group: schema:automation
    - id: M-05-6.2
      name: Multi-workflow process orchestration
      phase: P3
      outcome: 'A parent process coordinates child workflows, aggregates their results, and compensates
        when a child fails.

        '
      depends_on:
      - M-05-6.1
      - M-05-2.3
      - M-05-4.2
      parallel_safe: false
      data_introduced:
      - ProcessOrchestration
      - ProcessParticipant
      - CompensationAction
      acceptance:
      - A parent with three children completes only when all three reach a terminal state.
      - A failing child triggers the declared compensation action for each completed sibling, in reverse
        order.
      - Cancelling the parent cancels every running child within the configured drain window.
      - The parent result names which child failed and why.
      schema_conflict_group: schema:automation
  long_name: workflow and process execution
- id: '06'
  name: PRODUCT CORE
  repo: Nexus.Platform
  schema: product_core
  projects:
  - Nexus.ProductCore.Contracts
  - Nexus.ProductCore.Core
  - Nexus.ProductCore.Scope
  - Nexus.ProductCore.Infrastructure
  purpose: 'Provide reusable product-level capability - scope, membership, subscriptions, entitlements,
    quotas, settings, onboarding - so no product rebuilds them. Platform owns who you are; this layer
    owns who you are within a product.

    '
  owns:
  - Workspace
  - Project
  - Subproject
  - ProductProfile
  - ProductMembership
  - Plan
  - Subscription
  - Entitlement
  - FeatureFlag
  - Quota
  - ProductSetting
  - Preference
  - OnboardingState
  does_not_own:
  - Identity - Layer 01 CORE
  - Product identity in the registry sense - Layer 03
  - Domain data - Layer 12 PRODUCTS
  - Development structure above Project - Layer 07
  depends_on:
  - '01'
  - '02'
  - '03'
  features:
  - id: F-06-1
    name: Scope Primitives
    phase: P1
    purpose: 'Workspace, Project and Subproject recur across every consumer of the conversation layer.
      Developer needs Workspace to Project to Subproject to Milestone; a plain conversation needs Workspace
      to Project; machine work needs its own hierarchy entirely. This layer provides the shared trunk;
      consumers extend it.

      '
    responsibility: Generic scope hierarchy shared by all layers and products
    milestones:
    - id: M-06-1.1
      name: Workspace, Project and Subproject aggregates
      phase: P1
      outcome: 'Scope stops being a Chat-product concept and becomes a shared primitive that Developer,
        Experience and every future product consume.

        '
      depends_on:
      - M-02-1.5
      - M-01-2.1
      parallel_safe: false
      data_introduced:
      - Workspace
      - Project
      - Subproject
      acceptance:
      - Workspace, Project and Subproject exist in the product schema with Id/Seq/Ref.
      - Two different consumers resolve the same Project without either referencing the other.
      - The former Chat-product Workspace and Project types are gone, not duplicated.
      work_items:
      - id: WI-06-1.1.1
        name: Move Workspace and Project out of the Chat product
        scope:
          projects:
          - Nexus.ProductCore.Scope
          schemas:
          - product_core
          contracts:
          - Nexus.ProductCore.Contracts
        tasks:
        - id: T-06-1.1.1.1
          name: Relocate Workspace preserving the proven Id/Seq/Ref pattern
          subtasks:
          - id: S-06-1.1.1.1.1
            name: Ref stays WKS-00000001 format, computed persisted in SQL
          - id: S-06-1.1.1.1.2
            name: Reference remains a domain property with a Restore rehydration path
        - id: T-06-1.1.1.2
          name: Relocate Project and add Subproject
          subtasks:
          - id: S-06-1.1.1.2.1
            name: Project Ref PRJ-00000001
          - id: S-06-1.1.1.2.2
            name: Subproject self-references Project with NoAction on delete
        - id: T-06-1.1.1.3
          name: Migrate the schema from org and project to product
      - id: WI-06-1.1.2
        name: Scope contract for consumers
        scope:
          projects:
          - Nexus.ProductCore.Contracts
          schemas: []
          contracts:
          - Nexus.ProductCore.Contracts
        tasks:
        - id: T-06-1.1.2.1
          name: Define IScopeNode with id, kind, parent and display name
          subtasks:
          - id: S-06-1.1.2.1.1
            name: ScopeKind is extensible - consumers register their own kinds
          - id: S-06-1.1.2.1.2
            name: No consumer type appears in the contract assembly
      gate: GATE_A
      schema_conflict_group: schema:product_core
    - id: M-06-1.2
      name: Extensible scope registration
      phase: P1
      outcome: 'A layer or product declares its own scope hierarchy above or below the shared trunk without
        modifying Layer 06.

        '
      depends_on:
      - M-06-1.1
      parallel_safe: true
      data_introduced:
      - ScopeKindRegistration
      acceptance:
      - Developer registers Milestone, Feature, WorkItem, Task as scope kinds below Subproject.
      - A machine-domain consumer registers an entirely different hierarchy without code change in Layer
        06.
      - No if-product-equals branching exists anywhere in Layer 06.
      work_items:
      - id: WI-06-1.2.1
        name: Scope kind registry
        scope:
          projects:
          - Nexus.ProductCore.Scope
          schemas:
          - product_core
          contracts:
          - Nexus.ProductCore.Contracts
        tasks:
        - id: T-06-1.2.1.1
          name: Registration API for consumer-defined scope kinds
        - id: T-06-1.2.1.2
          name: Architecture test forbidding product-name branching in Layer 06
      gate: GATE_A
      schema_conflict_group: schema:product_core
  - id: F-06-2
    name: Product Membership and Profiles
    phase: P3
    purpose: 'One Nexus identity, many product contexts. A person is one user with a Vault profile, a
      Developer profile and a Trips traveller profile.

      '
    responsibility: Product membership, product profile framework
    milestones:
    - id: M-06-2.1
      name: Product profile and membership
      phase: P3
      outcome: A user joins a product and gets a product-scoped profile distinct from their identity.
      depends_on:
      - M-03-1.1
      - M-01-3.1
      parallel_safe: true
      data_introduced:
      - ProductProfile
      - ProductMembership
      acceptance:
      - The same user has different display settings in two products.
      - Removing product membership does not affect the Nexus identity.
      schema_conflict_group: schema:product_core
    - id: M-06-2.2
      name: Product-scoped roles
      phase: P3
      outcome: A user can be an admin in one product and a reader in another.
      depends_on:
      - M-06-2.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Permission evaluation combines platform roles and product roles.
  - id: F-06-3
    name: Subscriptions and Entitlements
    phase: P3
    purpose: 'Let a product gate capability by plan without each product inventing billing logic.

      '
    responsibility: Subscription framework, plans, entitlements, feature access
    milestones:
    - id: M-06-3.1
      name: Plans and subscriptions
      phase: P3
      outcome: A product defines plans and a member holds a subscription to one.
      depends_on:
      - M-06-2.1
      parallel_safe: true
      data_introduced:
      - Plan
      - Subscription
      acceptance:
      - A subscription has a lifecycle with trial, active, past-due and cancelled states.
      schema_conflict_group: schema:product_core
    - id: M-06-3.2
      name: Entitlements and feature access
      phase: P3
      outcome: A capability check resolves from the subscriber's entitlements.
      depends_on:
      - M-06-3.1
      parallel_safe: true
      data_introduced:
      - Entitlement
      - FeatureFlag
      acceptance:
      - A feature hidden on the free plan is inaccessible via API as well as UI.
      schema_conflict_group: schema:product_core
  - id: F-06-4
    name: Quotas and Product Metering
    phase: P3
    purpose: 'Bound consumption per product and per plan, using Platform''s usage records.

      '
    responsibility: Usage metering at product level, quotas, limits
    milestones:
    - id: M-06-4.1
      name: Product quotas
      phase: P3
      outcome: A product enforces a per-plan limit on a metered capability.
      depends_on:
      - M-01-4.2
      - M-06-3.2
      parallel_safe: true
      data_introduced:
      - Quota
      - QuotaConsumption
      acceptance:
      - Exceeding an AI token quota returns a clear, actionable error and records the denial.
      schema_conflict_group: schema:product_core
  - id: F-06-5
    name: Settings and Preferences
    phase: P3
    purpose: 'Give products a consistent place for configuration that belongs to a member or to a product
      instance.

      '
    responsibility: Product settings, preferences
    milestones:
    - id: M-06-5.1
      name: Scoped settings
      phase: P3
      outcome: Settings resolve through product, workspace, project and member in a defined order.
      depends_on:
      - M-06-1.1
      - M-06-2.1
      parallel_safe: true
      data_introduced:
      - ProductSetting
      - Preference
      acceptance:
      - A member preference overrides a workspace default, which overrides a product default.
      schema_conflict_group: schema:product_core
  - id: F-06-6
    name: Onboarding
    phase: P3
    purpose: 'Stop each product inventing its own first-run experience.

      '
    responsibility: Onboarding framework, product lifecycle hooks
    milestones:
    - id: M-06-6.1
      name: Onboarding state machine
      phase: P3
      outcome: A product declares onboarding steps and a member's progress is tracked.
      depends_on:
      - M-06-2.1
      parallel_safe: true
      data_introduced:
      - OnboardingState
      acceptance:
      - An interrupted onboarding resumes at the correct step after sign-in.
      schema_conflict_group: schema:product_core
  long_name: reusable product-level capability and scope primitives
  scope_trunk: Workspace -> Project -> Subproject. Consumers extend below Subproject. These are PRODUCT
    CORE primitives, never a product's.
- id: '07'
  name: DEVELOPER
  repo: Nexus.Developer
  schema: developer
  database_note: 'Developer uses the dev schema in NexusPlatform. It is a strong candidate to split to
    its own database at P3 because it will carry the highest write volume of any layer once autonomous
    runs begin.

    '
  projects:
  - Nexus.Developer.Contracts
  - Nexus.Developer.Core
  - Nexus.Developer.Graph
  - Nexus.Developer.Orchestration
  - Nexus.Developer.Infrastructure
  - Nexus.Developer.Api
  - Nexus.Developer.Client
  purpose: 'Define, plan, build, test, review and coordinate software development, and be the structured
    system of record for development state - replacing chat transcripts and markdown. Developer builds
    the products and it builds the other layers, including itself.

    '
  owns:
  - ProductDevelopment
  - Module
  - Feature
  - Requirement
  - Release
  - Milestone
  - WorkItem
  - Task
  - Subtask
  - Dependency
  - ScopeDeclaration
  - Worker
  - WorkerAssignment
  - DevelopmentRun
  - BuildRecord
  - TestRun
  - Review
  - IntegrationRun
  - DevelopmentResult
  - ProgressState
  - StatusHistory
  does_not_own:
  - Product identity - Layer 03 GOVERNANCE, Developer references a ProductId
  - Workspace, Project, Subproject - Layer 06 PRODUCT CORE owns the scope trunk
  - Repository and CI mechanics - Layer 08 DELIVERY produces a build, Developer interprets it
  - Runtime health - Layer 10 OPERATIONS
  - Specification documents - Layer 02 DATA, DEVELOPER links to a Document by id
  - Conversation storage - Layer 11 EXPERIENCE, DEVELOPER supplies scope and context
  depends_on:
  - '01'
  - '02'
  - '03'
  - '04'
  - '05'
  - '06'
  - 08
  - '11'
  note: 'Developer has its own conversation surface, but it does not implement chat. It registers its
    scope hierarchy with Layer 06 and implements the Layer 11 EXPERIENCE scope resolver, so a conversation
    held against a Milestone receives that milestone''s context. Everything needed to develop a product
    is reachable from here.

    '
  features:
  - id: F-07-1
    name: Work Graph
    phase: P1
    purpose: 'Development state currently lives in conversation and is lost between sessions. Nexus cannot
      coordinate simultaneous workers without a machine-readable model of what is being built and what
      depends on what.

      '
    responsibility: Product definition, modules, milestones, work items, tasks, subtasks
    milestones:
    - id: M-07-1.1
      name: Work graph aggregates
      phase: P1
      outcome: 'The full hierarchy from ProductDevelopment down to Subtask exists as queryable structure
        rather than prose.

        '
      depends_on:
      - M-03-1.1
      - M-06-1.1
      - M-02-2.1
      parallel_safe: false
      data_introduced:
      - ProductDevelopment
      - Module
      - Feature
      - Milestone
      - WorkItem
      - Task
      - Subtask
      acceptance:
      - Every node type exists in the dev schema with Id/Seq/Ref.
      - A Milestone references a Layer 02 DATA Document by id for its specification.
      - A ProductDevelopment references a Layer 03 GOVERNANCE ProductId.
      - Developer registers Milestone, Feature, WorkItem, Task as Layer 06 PRODUCT CORE scope kinds.
      - Architecture tests confirm Developer references no product domain assembly.
      work_items:
      - id: WI-07-1.1.1
        name: Hierarchy aggregates
        scope:
          projects:
          - Nexus.Developer.Core
          - Nexus.Developer.Graph
          schemas:
          - developer
          contracts:
          - Nexus.Developer.Contracts
        tasks:
        - id: T-07-1.1.1.1
          name: Define ProductDevelopment, Module and Feature
          subtasks:
          - id: S-07-1.1.1.1.1
            name: ProductDevelopment hangs off a Governance ProductId, not a name
          - id: S-07-1.1.1.1.2
            name: Refs PDV, MOD, FEA in the established format
        - id: T-07-1.1.1.2
          name: Define Milestone, WorkItem, Task, Subtask
          subtasks:
          - id: S-07-1.1.1.2.1
            name: Milestone carries phase, outcome and DocumentRef
          - id: S-07-1.1.1.2.2
            name: Absorb the existing Chat-domain WorkItem rather than duplicating it
          - id: S-07-1.1.1.2.3
            name: Self-referencing parents use NoAction to avoid cascade cycles
      - id: WI-07-1.1.2
        name: ScopeDeclaration
        scope:
          projects:
          - Nexus.Developer.Graph
          schemas:
          - developer
          contracts: []
        note: 'Built here rather than with the analysis feature. ScopeDeclaration is what makes parallel
          safety computable, and adding it later means backfilling every work item.

          '
        tasks:
        - id: T-07-1.1.2.1
          name: Declare projects, files, schema contexts and contracts per work item
          subtasks:
          - id: S-07-1.1.2.1.1
            name: SchemaContexts is a distinct field - two migrations on one DbContext conflict
          - id: S-07-1.1.2.1.2
            name: Contracts field captures shared-boundary changes
      - id: WI-07-1.1.3
        name: Roadmap import
        scope:
          projects:
          - Nexus.Developer.Infrastructure
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-1.1.3.1
          name: Import nexus-roadmap.yaml into the work graph
          subtasks:
          - id: S-07-1.1.3.1.1
            name: Idempotent - re-import updates rather than duplicates
          - id: S-07-1.1.3.1.2
            name: Import this roadmap and confirm node counts match the source
          - id: S-07-1.1.3.1.3
            name: Report any dependency id that does not resolve
      gate: GATE_A
      schema_conflict_group: schema:developer
    - id: M-07-1.2
      name: Work graph API and views
      phase: P1
      outcome: The graph is readable and editable by a person, not only by an importer.
      depends_on:
      - M-07-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A milestone and its descendants are retrievable in one call.
      - A work item can be created, edited and re-parented.
      - Filtering by phase returns only that phase's nodes.
      work_items:
      - id: WI-07-1.2.1
        name: Graph query and mutation API
        scope:
          projects:
          - Nexus.Developer.Api
          schemas: []
          contracts: []
        tasks:
        - id: T-07-1.2.1.1
          name: Subtree retrieval with depth limit
        - id: T-07-1.2.1.2
          name: CRUD with re-parenting and cycle rejection
      gate: GATE_A
  - id: F-07-2
    name: Dependency and Parallel-Safe Analysis
    phase: P1
    purpose: 'Decide what can run at the same time. This is the capability the Foundation Gate exists
      to prove, and getting it wrong corrupts work rather than merely slowing it.

      '
    responsibility: Dependency graph, parallel-safe analysis
    milestones:
    - id: M-07-2.1
      name: Dependency graph
      phase: P1
      outcome: Blocking and parallel relationships are explicit and transitively resolvable.
      depends_on:
      - M-07-1.1
      parallel_safe: true
      data_introduced:
      - Dependency
      acceptance:
      - A transitive block is detected - A blocks B, B blocks C, so C is blocked by A.
      - A dependency cycle is rejected at write time with the cycle path named.
      - Dependency kinds Blocking, Parallel and Informational are distinguished.
      work_items:
      - id: WI-07-2.1.1
        name: Dependency model and traversal
        scope:
          projects:
          - Nexus.Developer.Graph
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-2.1.1.1
          name: Dependency aggregate with kind
        - id: T-07-2.1.1.2
          name: Transitive closure with cycle detection
          subtasks:
          - id: S-07-2.1.1.2.1
            name: Unit test for a three-hop transitive block
          - id: S-07-2.1.1.2.2
            name: Unit test rejecting a self-cycle and a two-node cycle
      gate: GATE_A
      schema_conflict_group: schema:developer
    - id: M-07-2.2
      name: Parallel-safety rules
      phase: P1
      outcome: 'Given any two work items, the system answers whether they may run simultaneously, and
        says why not when they may not.

        '
      depends_on:
      - M-07-2.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Rule 1 - no dependency path, transitively, between the two.
      - Rule 2 - no file or project scope overlap.
      - Rule 3 - no shared schema mutation; two migrations on one DbContext conflict even on different
        tables.
      - Rule 4 - no contract mutation on a shared boundary.
      - Rule 5 - not both high risk.
      - Each rule has a unit test that fails if the rule is removed.
      - The analysis reproduces the parallelisation matrix in the architecture report from declared data
        alone.
      work_items:
      - id: WI-07-2.2.1
        name: Safety rule engine
        scope:
          projects:
          - Nexus.Developer.Graph
          schemas: []
          contracts: []
        tasks:
        - id: T-07-2.2.1.1
          name: Implement the five rules over ScopeDeclaration
          subtasks:
          - id: S-07-2.2.1.1.1
            name: Rule 3 is the one most often got wrong - test it first
          - id: S-07-2.2.1.1.2
            name: Every negative verdict names the rule and the conflicting node
        - id: T-07-2.2.1.2
          name: Six-way classification output
          subtasks:
          - id: S-07-2.2.1.2.1
            name: Can run now, Can run together, Blocked, Waiting for dependency, High conflict risk,
              Must be sequential
      - id: WI-07-2.2.2
        name: Execution plan generation
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-2.2.2.1
          name: Produce an ordered set of parallel-safe batches
        - id: T-07-2.2.2.2
          name: Recommend a worker count per batch
      gate: GATE_A
  - id: F-07-3
    name: Worker and Run Orchestration
    phase: P1
    purpose: 'Bind work to an isolated execution context and record what happened, so three workers can
      operate without touching each other.

      '
    responsibility: Worker manager, model assignment, branch and worktree coordination
    milestones:
    - id: M-07-3.1
      name: Worker, assignment and run
      phase: P1
      outcome: 'A work item can be assigned to an isolated worker with its own branch and worktree, and
        the run is a record.

        '
      depends_on:
      - M-07-2.2
      - M-08-1.2
      parallel_safe: true
      data_introduced:
      - Worker
      - WorkerAssignment
      - DevelopmentRun
      acceptance:
      - Three assignments hold three distinct worktree paths with overlapping timestamps.
      - Two assignments cannot claim the same worktree path.
      - A worktree path is allocated as a sibling of the repository, never nested inside it.
      - A run records start, end and terminal state.
      work_items:
      - id: WI-07-3.1.1
        name: Worker and assignment model
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-3.1.1.1
          name: Worker with capability profile
          subtasks:
          - id: S-07-3.1.1.1.1
            name: Profile declares repositories, languages and permitted risk level
          - id: S-07-3.1.1.1.2
            name: Worker kinds - Human, CodingAgent, Autonomous
        - id: T-07-3.1.1.2
          name: WorkerAssignment with uniqueness on active worktree path
      - id: WI-07-3.1.2
        name: Branch and worktree coordination
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-3.1.2.1
          name: Branch naming from the work item id
          subtasks:
          - id: S-07-3.1.2.1.1
            name: work/<id> off integration/<milestone> off main
        - id: T-07-3.1.2.2
          name: Sibling worktree path allocation
          subtasks:
          - id: S-07-3.1.2.2.1
            name: Windows file locking - a nested worktree cannot be renamed while an agent runs in it
      gate: GATE_A
      schema_conflict_group: schema:developer
    - id: M-07-3.2
      name: Autonomous dispatch
      phase: P2
      outcome: 'Developer starts, monitors and completes runs itself. This is the V1a to V1b transition.

        '
      depends_on:
      - M-07-4.1
      - M-07-5.1
      - M-05-1.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Developer dispatches three workers without a human issuing a command.
      - A hung run is detected and escalated rather than blocking the batch.
      - A failed dispatch retries under Layer 05 policy and stops after a bounded count.
      work_items:
      - id: WI-07-3.2.1
        name: Dispatcher
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
      - id: WI-07-3.2.2
        name: Run monitoring and escalation
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
      gate: GATE_B
    - id: M-07-3.3
      name: Model assignment and run cost
      phase: P2
      outcome: A run is assigned a model by policy and reports what it spent.
      depends_on:
      - M-04-4.1
      - M-07-3.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A low-risk mechanical work item is assigned a cheaper model than an architectural one.
      - Run cost is queryable per milestone.
      work_items:
      - id: WI-07-3.3.1
        name: Model assignment policy
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
      gate: GATE_B
  - id: F-07-4
    name: Build and Test Capture
    phase: P1
    purpose: 'Turn a pipeline result into development meaning. Delivery produces a build; Developer decides
      whether it satisfies the work item.

      '
    responsibility: Build coordination, test coordination
    milestones:
    - id: M-07-4.1
      name: Build and test records
      phase: P1
      outcome: 'Every run carries evidence from CI rather than a human''s assertion that it built.

        '
      depends_on:
      - M-07-3.1
      - M-08-1.3
      parallel_safe: true
      data_introduced:
      - BuildRecord
      - TestRun
      acceptance:
      - A CI result is ingested and linked to the correct run without manual entry.
      - Three concurrent runs produce three distinct build records on three branches.
      - A failing build blocks its own work item and no other.
      work_items:
      - id: WI-07-4.1.1
        name: CI result ingestion
        scope:
          projects:
          - Nexus.Developer.Infrastructure
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-4.1.1.1
          name: Consume the Layer 08 machine-readable result artifact
          subtasks:
          - id: S-07-4.1.1.1.1
            name: Match by branch name to the work item id
          - id: S-07-4.1.1.1.2
            name: Reject a result whose branch matches no active assignment
        - id: T-07-4.1.1.2
          name: BuildRecord and TestRun with counts and outcome
      - id: WI-07-4.1.2
        name: Failure isolation
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-4.1.2.1
          name: Scope a failure to its own work item and run
          subtasks:
          - id: S-07-4.1.2.1.1
            name: Integration test - fail worker B, confirm A and C complete
      gate: GATE_A
      schema_conflict_group: schema:developer
  - id: F-07-5
    name: Review, Integration and Progress
    phase: P1
    purpose: 'Close the loop. Work that is built and tested still has to be judged and merged without
      breaking what is already there.

      '
    responsibility: Review, integration, development results, progress state
    milestones:
    - id: M-07-5.1
      name: Review and controlled integration
      phase: P1
      outcome: 'Parallel work merges deliberately, in order, each merge verified, rather than optimistically.

        '
      depends_on:
      - M-07-4.1
      parallel_safe: true
      data_introduced:
      - Review
      - IntegrationRun
      - DevelopmentResult
      acceptance:
      - A run cannot integrate without a recorded human decision.
      - Integration into the milestone branch is sequential and each merge is verified green.
      - A rejected review returns the work item to its worker with the reason recorded.
      - Every completed work item has a DevelopmentResult with evidence references.
      work_items:
      - id: WI-07-5.1.1
        name: Review model
        scope:
          projects:
          - Nexus.Developer.Core
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-5.1.1.1
          name: Review with reviewer, decision and reason
          subtasks:
          - id: S-07-5.1.1.1.1
            name: Reviewer is a Layer 01 CORE User, not a string
      - id: WI-07-5.1.2
        name: Integration runner
        scope:
          projects:
          - Nexus.Developer.Orchestration
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-5.1.2.1
          name: Sequential merge into the integration branch
        - id: T-07-5.1.2.2
          name: Halt the batch on a red integration build
      gate: GATE_A
      schema_conflict_group: schema:developer
    - id: M-07-5.2
      name: Derived progress
      phase: P1
      outcome: 'Progress is computed from structured work, and refuses to report a number it cannot justify.

        '
      depends_on:
      - M-07-5.1
      parallel_safe: true
      data_introduced:
      - ProgressState
      - StatusHistory
      acceptance:
      - Milestone progress equals completed children over total children, weighted by estimate where present.
      - A parent not marked BreakdownComplete reports not estimable rather than a percentage.
      - Blocked is derived from unmet blocking dependencies, never entered by hand.
      - A manual status override records who set it and why.
      work_items:
      - id: WI-07-5.2.1
        name: Progress derivation
        scope:
          projects:
          - Nexus.Developer.Graph
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-5.2.1.1
          name: Recursive completion with estimate weighting
        - id: T-07-5.2.1.2
          name: BreakdownComplete honesty rule
          subtasks:
          - id: S-07-5.2.1.2.1
            name: Unit test - three of twenty declared children reports not estimable, not 15 percent
      - id: WI-07-5.2.2
        name: Status history
        scope:
          projects:
          - Nexus.Developer.Core
          schemas:
          - developer
          contracts: []
        tasks:
        - id: T-07-5.2.2.1
          name: Append-only transitions with actor and reason
      gate: GATE_A
      schema_conflict_group: schema:developer
    - id: M-07-5.3
      name: Foundation Gate acceptance
      phase: P1
      outcome: 'Three independent work items are planned, isolated, built, tested, reviewed and integrated
        simultaneously with every step recorded. The gate is closed.

        '
      depends_on:
      - M-07-5.2
      parallel_safe: false
      data_introduced: []
      acceptance:
      - Three work items are analysed and classified Can run together.
      - Three assignments with distinct worktrees and overlapping timestamps.
      - Three build records and three test runs on three branches.
      - Worker B is deliberately failed; A and C complete unaffected; B's failure is recorded against
        B only.
      - Three development results with evidence.
      - Three reviews with human decisions.
      - Three integration runs, sequential, each green.
      - Parent milestone progress reflects exactly the completed subset.
      - No step required a human to read a log and retype a result.
      work_items:
      - id: WI-07-5.3.1
        name: Run the acceptance test
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-07-5.3.1.1
          name: Select three genuinely independent P2 work items as the subjects
        - id: T-07-5.3.1.2
          name: Execute and capture evidence for all nine criteria
        - id: T-07-5.3.1.3
          name: Record the gate decision as an ADR
      gate: GATE_A
  - id: F-07-6
    name: Developer Conversation
    phase: P2
    purpose: 'Make the work graph conversational. Developer is where a person asks what is blocked, what
      changed, why a decision was made - against real structure, not a transcript.

      '
    responsibility: Developer chat, human approval, developer dashboard
    milestones:
    - id: M-07-6.1
      name: Scope resolver for the work graph
      phase: P2
      outcome: 'A conversation held against a Milestone or WorkItem receives that node''s real context,
        without Layer 10 knowing what a Milestone is.

        '
      depends_on:
      - M-07-1.1
      - M-11-2.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A conversation scoped to a milestone yields its outcome, dependencies, work items and linked document
        as ContextItems.
      - Layer 11 EXPERIENCE contains no DEVELOPER type; AI contains no DEVELOPER type.
      - Changing the milestone changes the conversation's context without a code change.
      work_items:
      - id: WI-07-6.1.1
        name: IScopeResolver implementation
        scope:
          projects:
          - Nexus.Developer.Core
          schemas: []
          contracts: []
        tasks:
        - id: T-07-6.1.1.1
          name: Flatten work-graph nodes to ContextItem
          subtasks:
          - id: S-07-6.1.1.1.1
            name: Milestone outcome maps to Kind Objective
          - id: S-07-6.1.1.1.2
            name: Blocking dependency maps to Kind Constraint
          - id: S-07-6.1.1.1.3
            name: DevelopmentResult maps to Kind Outcome
          - id: S-07-6.1.1.1.4
            name: Trust derives from record age and review state
      gate: GATE_B
    - id: M-07-6.2
      name: Developer chat surface
      phase: P2
      outcome: A person can hold a conversation about any node and act on the answer.
      depends_on:
      - M-07-6.1
      - M-11-3.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Asking what is blocking this milestone returns an answer citing dependency records.
      - An approval can be given in conversation and it writes a real Review.
      work_items:
      - id: WI-07-6.2.1
        name: Conversation surface over the graph
        scope:
          projects:
          - Nexus.Developer.Client
          schemas: []
          contracts: []
      gate: GATE_B
    - id: M-07-6.3
      name: Developer dashboard
      phase: P2
      outcome: Current state across all active work is visible at a glance.
      depends_on:
      - M-07-5.2
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Active runs, blocked items, failing builds and awaiting-review counts are on one view.
      work_items:
      - id: WI-07-6.3.1
        name: Dashboard views
        scope:
          projects:
          - Nexus.Developer.Client
          schemas: []
          contracts: []
      gate: GATE_B
  - id: F-07-7
    name: Requirements and Releases
    phase: P1
    purpose: 'Connect what was asked for to what was built, and group what was built into something shippable.

      '
    responsibility: Requirements, roadmaps, releases
    milestones:
    - id: M-07-7.1
      name: Requirements
      phase: P1
      outcome: A requirement traces to the features and work items that satisfy it.
      depends_on:
      - M-07-1.1
      parallel_safe: true
      data_introduced:
      - Requirement
      acceptance:
      - A requirement with no satisfying work item is reported as uncovered.
      work_items:
      - id: WI-07-7.1.1
        name: Requirement model and coverage
        scope:
          projects:
          - Nexus.Developer.Core
          schemas:
          - developer
          contracts: []
      gate: GATE_A
      schema_conflict_group: schema:developer
    - id: M-07-7.2
      name: Releases and maturity
      phase: P2
      outcome: 'Work groups into a release carrying a maturity level, kept separate from the environment
        it happens to be deployed to.

        '
      depends_on:
      - M-07-7.1
      - M-08-4.1
      parallel_safe: true
      data_introduced:
      - Release
      acceptance:
      - Release maturity uses Idea through End of Life, never Dev/Test/Prod.
      - A Beta release can be recorded as running in Production without contradiction.
      work_items:
      - id: WI-07-7.2.1
        name: Release model with orthogonal maturity and environment
        scope:
          projects:
          - Nexus.Developer.Core
          schemas:
          - developer
          contracts: []
      gate: GATE_B
      schema_conflict_group: schema:developer
  - id: F-07-8
    name: Product and Architecture Definition
    phase: P3
    purpose: 'Let a product be designed inside Nexus - its modules, schema, API and UI - rather than described
      in documents and rebuilt by hand.

      '
    responsibility: Product designer, schema designer, API definition, UI definition, capability packs
    milestones:
    - id: M-07-8.1
      name: Product and module designer
      phase: P3
      outcome: A new product's structure is declared and generates its skeleton.
      depends_on:
      - M-07-7.2
      - M-12-1.1
      parallel_safe: true
      data_introduced:
      - ProductDefinition
      - ModuleDefinition
      acceptance:
      - A declared product produces a compiling project structure with no hand-written scaffolding.
      schema_conflict_group: schema:developer
    - id: M-07-8.2
      name: Schema and API definition
      phase: P3
      outcome: Entities and endpoints are declared once and generate configuration, migration and contract.
      depends_on:
      - M-07-8.1
      parallel_safe: true
      data_introduced:
      - SchemaDefinition
      - ApiDefinition
      acceptance:
      - A declared aggregate generates its EF configuration and migration following Id/Seq/Ref.
      schema_conflict_group: schema:developer
    - id: M-07-8.3
      name: Capability packs and technology profiles
      phase: P3
      outcome: 'A product is composed from declared capability packs rather than from conditional logic
        keyed on product identity.

        '
      depends_on:
      - M-07-8.1
      parallel_safe: true
      data_introduced:
      - CapabilityPack
      - TechnologyProfile
      acceptance:
      - Vault equals Web plus Mobile plus Desktop plus Documents plus AI plus Security plus Offline Sync,
        declared not coded.
      - An architecture test fails any branch on product name across the whole solution.
      schema_conflict_group: schema:developer
  - id: F-07-9
    name: Self-Improvement
    phase: P5
    purpose: 'Nexus builds Nexus. Developer proposes its own next work from observed results rather than
      waiting to be told.

      '
    responsibility: Development results, evaluation feedback
    milestones:
    - id: M-07-9.1
      name: Outcome-driven work proposal
      phase: P5
      outcome: Developer proposes work items derived from failures, incidents and evaluation regressions.
      depends_on:
      - M-04-5.3
      - M-10-3.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A recurring build failure produces a proposed work item with its evidence attached.
      - Every proposal requires human approval before entering the graph.
  long_name: define, plan and build software
  scope_extension: Subproject -> Release -> Milestone -> Feature -> WorkItem -> Task -> Subtask
- id: 08
  name: DELIVERY
  repo: Nexus.Platform
  schema: delivery
  projects:
  - Nexus.Delivery.Contracts
  - Nexus.Delivery.Core
  - Nexus.Delivery.Infrastructure
  pipeline_note: 'Contracts and records live in Nexus.Platform. The pipelines themselves live as configuration
    inside each repository, because a pipeline that is not next to the code it builds drifts from it.

    '
  purpose: 'Safely move source into reproducible running systems and preserve everything required to reconstruct
    them.

    '
  owns:
  - Repository
  - GitBranch
  - Tag
  - Commit
  - BuildArtifact
  - Pipeline
  - PipelineRun
  - Environment
  - Deployment
  - InfrastructureResource
  - BackupRecord
  - RestorePoint
  does_not_own:
  - The meaning of a build - Layer 07 decides whether it satisfies a work item
  - Runtime health after deployment - Layer 10 OPERATIONS
  - Product identity - Layer 03 GOVERNANCE
  depends_on:
  - '01'
  - '03'
  correction_note: 'The original brief placed this layer after the Foundation Gate. It cannot be. The
    gate''s own acceptance test requires independent build, independent test and result capture across
    three simultaneous workers, and none of that is demonstrable without CI. A minimal slice moves to
    P0 and is the first work in the entire roadmap.

    '
  features:
  - id: F-08-1
    name: Continuous Integration
    phase: P0
    purpose: 'There is no CI anywhere. Build and test results are a human''s assertion on one laptop,
      which does not survive a single parallel worker and produces no evidence trail.

      '
    responsibility: Build infrastructure, CI, branch policies
    milestones:
    - id: M-08-1.1
      name: Package feed reachable from CI
      phase: P0
      outcome: 'Platform and Intelligence packages resolve from somewhere a build agent can reach, unblocking
        every pipeline that follows.

        '
      depends_on: []
      parallel_safe: true
      data_introduced: []
      acceptance:
      - Platform and Intelligence packages publish to GitHub Packages.
      - A clean machine with no C:\Personal\LocalNuGet restores every solution.
      - nuget.config in each repository points at the reachable feed.
      work_items:
      - id: WI-08-1.1.1
        name: Migrate off the local file feed
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-08-1.1.1.1
          name: Publish Nexus.Platform.* packages to GitHub Packages
          subtasks:
          - id: S-08-1.1.1.1.1
            name: Replace pack-local.ps1 with a publish step
          - id: S-08-1.1.1.1.2
            name: Feed credential resolved through ISecretResolver, never committed
        - id: T-08-1.1.1.2
          name: Publish Nexus.Intelligence.* packages
        - id: T-08-1.1.1.3
          name: Verify restore on a clean checkout
      gate: GATE_A
    - id: M-08-1.2
      name: Pipelines on every repository
      phase: P0
      outcome: 'Every push restores, builds and tests automatically, in all repositories rather than none.

        '
      depends_on:
      - M-08-1.1
      parallel_safe: true
      data_introduced: []
      acceptance:
      - A push to any repository triggers restore, build and test.
      - Nexus.Experience and Nexus.Intelligence have a .github directory, which today they do not.
      - The frontend build and typecheck run in the Nexus.Experience pipeline.
      - A deliberately broken commit produces a red build, demonstrated once and recorded.
      work_items:
      - id: WI-08-1.2.1
        name: Nexus.Platform pipeline
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-08-1.2.1.1
          name: build.yml with .NET 10 setup, restore, build Nexus.Platform.slnx
          subtasks:
          - id: S-08-1.2.1.1.1
            name: This is the first pipeline and establishes the pattern the others copy
        - id: T-08-1.2.1.2
          name: Test step with trx logger and result upload
      - id: WI-08-1.2.2
        name: Nexus.Intelligence pipeline
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-08-1.2.2.1
          name: Create .github/workflows and mirror the Nexus.Platform pattern
      - id: WI-08-1.2.3
        name: Nexus.Experience pipeline
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-08-1.2.3.1
          name: .NET build and test
        - id: T-08-1.2.3.2
          name: Node build, typecheck and lint for the client
      - id: WI-08-1.2.4
        name: Test project hygiene
        scope:
          projects: []
          schemas: []
          contracts: []
        tasks:
        - id: T-08-1.2.4.1
          name: Give Nexus.Platform.Tests a real test or delete it
          subtasks:
          - id: S-08-1.2.4.1.1
            name: An empty test project passing in CI is a false green and worse than no project
      gate: GATE_A
    - id: M-08-1.3
      name: Machine-readable results
      phase: P0
